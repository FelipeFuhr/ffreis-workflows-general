name: General / Workflow Failure Alert

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false

jobs:
  alert:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Comment on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run) {
              core.warning("No workflow_run payload found; skipping alert.");
              return;
            }
            const prs = run.pull_requests ?? [];
            if (!prs.length) return;
            const body = [
              `### ⚠️ Workflow failed: **${run.name}**`,
              ``,
              `The [${run.name} run](${run.html_url}) completed with conclusion \`${run.conclusion}\`.`,
              `Branch: \`${run.head_branch}\` · Commit: \`${run.head_sha.slice(0, 7)}\``,
            ].join("\n");
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
