name: General / shellcheck

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan for shell scripts
        required: false
        type: string
        default: .
      files:
        description: Optional newline-separated list of files to check (relative to working-directory)
        required: false
        type: string
        default: ""
      fail-on-error:
        description: Fail the workflow if shellcheck finds any issues
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  shellcheck:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run shellcheck
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          FILES_INPUT: ${{ inputs.files }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"

          files=()
          if [[ -n "$FILES_INPUT" ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              files+=("$line")
            done <<< "$FILES_INPUT"
          else
            while IFS= read -r -d '' f; do
              files+=("${f#./}")
            done < <(find . -type f -name '*.sh' -print0)
          fi

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No shell scripts found; skipping."
            exit 0
          fi

          shellcheck -x "${files[@]}"
