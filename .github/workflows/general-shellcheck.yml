name: General / shellcheck

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan for shell scripts
        required: false
        type: string
        default: .
      files:
        description: Optional newline-separated list of files to check (relative to working-directory)
        required: false
        type: string
        default: ""
      fail-on-error:
        description: Fail the workflow if shellcheck finds any issues
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

permissions: {}

jobs:
  shellcheck:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run shellcheck
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          FILES_INPUT: ${{ inputs.files }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"

          files=()
          if [[ -n "$FILES_INPUT" ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              files+=("$line")
            done <<< "$FILES_INPUT"
          else
            # BEGIN select-shell-files
            is_shell_script() {
            	local f=$1
            	case "$f" in
            	*.sh) return 0 ;;
            	esac
            	local base=${f##*/}
            	case "$base" in
            	*.*) return 1 ;; # has a non-.sh extension (e.g. a template) -> out of scope
            	esac
            	local first_line tok interp t
            	[[ -f "$f" ]] || return 1
            	IFS= read -r -N 100 first_line <"$f" 2>/dev/null
            	[[ -z "${first_line:-}" ]] && return 1
            	first_line=${first_line%%$'\n'*}
            	first_line=${first_line%$'\r'}
            	[[ "$first_line" == '#!'* ]] || return 1
            	read -ra tok <<<"${first_line#'#!'}"
            	[[ "${#tok[@]}" -eq 0 ]] && return 1
            	interp=${tok[0]##*/}
            	if [[ "$interp" == env ]]; then
            		interp=""
            		for t in "${tok[@]:1}"; do
            			[[ "$t" == -* ]] && continue
            			interp=${t##*/}
            			break
            		done
            	fi
            	case "$interp" in
            	sh | bash | dash | ksh) return 0 ;;
            	*) return 1 ;;
            	esac
            }

            while IFS= read -r -d '' f; do
            	is_shell_script "$f" && files+=("${f#./}")
            done < <(find . \( -type d \( -name .git -o -name node_modules -o -name vendor -o -name target \) \) -prune -o -type f -print0)
            # END select-shell-files
          fi

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No shell scripts found; skipping."
            exit 0
          fi

          # -P SCRIPTDIR: shellcheck can't statically resolve source paths
          # built from `$(dirname "$0")` (the value of $0 is only known at
          # runtime); SCRIPTDIR tells it to look relative to each sourcing
          # file's own directory, which is what that idiom actually does.
          shellcheck -x -P SCRIPTDIR "${files[@]}"
