name: General / gitleaks

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan
        required: false
        type: string
        default: .
      scan-history:
        description: Scan git history (requires fetch-depth 0)
        required: false
        type: boolean
        default: false
      gitleaks-version:
        description: gitleaks version to install (without leading v)
        required: false
        type: string
        default: 8.30.1
      config-path:
        description: Optional gitleaks config path (relative to repo root)
        required: false
        type: string
        default: ""
      upload-sarif:
        description: Upload SARIF to GitHub code scanning
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

concurrency:
  # Distinct group (literal "gitleaks" infix) so this never matches a caller's
  # ${{ github.workflow }}-${{ github.ref }} group. When invoked via
  # workflow_call, github.workflow resolves to the CALLER's name, so an
  # identical group would deadlock ("between a top level workflow and 'gitleaks'").
  group: ${{ github.workflow }}-gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gitleaks:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes || 15 }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ inputs.scan-history && 0 || 1 }}

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version || '8.30.1' }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "$url" -o "$tmp/gitleaks.tgz"
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          CONFIG_PATH: ${{ inputs.config-path }}
          SCAN_HISTORY: ${{ inputs.scan-history }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [[ -z "$CONFIG_PATH" && -f ".gitleaks.toml" ]]; then
            # Anchor to a real TOML table header (line start) so a mere mention
            # of the token in a comment or string does not false-positive.
            if grep -qE '^[[:space:]]*\[\[allowlist\]\]' .gitleaks.toml; then
              echo "ERROR: .gitleaks.toml uses legacy '[[allowlist]]' (array) format."
              echo "Gitleaks expects a single '[allowlist]' table (map)."
              echo "Fix: merge the entries into one '[allowlist]' with combined 'regexes'/'paths'."
              exit 1
            fi
          fi
          args=(detect --no-banner --redact --source . --report-format sarif --report-path "${GITHUB_WORKSPACE}/gitleaks.sarif")
          if [[ "$SCAN_HISTORY" != "true" ]]; then
            args+=(--no-git)
          fi
          if [[ -n "$CONFIG_PATH" ]]; then
            args+=(--config "${GITHUB_WORKSPACE}/${CONFIG_PATH}")
          fi
          gitleaks "${args[@]}"

      - name: Upload SARIF
        if: inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
