
name: General Code Quality (Go + Shell)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to run checks in"
        required: false
        type: string
        default: "."
      enable-go:
        description: "Enable Go checks (requires go.mod in working-directory)"
        required: false
        type: boolean
        default: true
      enable-shell:
        description: "Enable shell checks"
        required: false
        type: boolean
        default: true
      cognitive-complexity-threshold:
        description: "Max allowed cognitive complexity"
        required: false
        type: number
        default: 15
      golangci-lint-version:
        description: "golangci-lint version"
        required: false
        type: string
        default: "v2.11.4"
      shfmt-version:
        description: "shfmt version (tag)"
        required: false
        type: string
        default: "v3.8.0"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  go:
    if: inputs.enable-go
    name: Go (gofmt + complexity + golangci-lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      COMPLEXITY_THRESHOLD: ${{ inputs.cognitive-complexity-threshold }}
      GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect go.mod
        id: go_mod
        run: |-
          set -euo pipefail

          if [[ -f "go.mod" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.go_mod.outputs.found == 'true'
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: gofmt (autofix)
        if: steps.go_mod.outputs.found == 'true'
        run: |-
          set -euo pipefail

          gofmt -w .

          if ! git diff --quiet; then
            git diff > "$RUNNER_TEMP/code-quality.patch"
            echo "::error title=gofmt required::Run gofmt and commit the changes."
            exit 1
          fi

      - name: Upload patch (gofmt)
        if: failure() && steps.go_mod.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-quality-gofmt.patch
          path: ${{ runner.temp }}/code-quality.patch

      - name: Cognitive complexity gate (gocognit)
        if: steps.go_mod.outputs.found == 'true'
        run: |-
          set -euo pipefail

          go run github.com/uudashr/gocognit/cmd/gocognit@v1.2.1 \
            -over "$COMPLEXITY_THRESHOLD" \
            -test \
            -ignore '(/vendor/|/generated/)' \
            .

      - name: golangci-lint
        if: steps.go_mod.outputs.found == 'true'
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          install-mode: goinstall
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m
          working-directory: ${{ inputs.working-directory }}

      - name: go test
        if: steps.go_mod.outputs.found == 'true'
        run: go test ./... -count=1

  shell:
    if: inputs.enable-shell
    name: Shell (shfmt + shellcheck + safety gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      SHFMT_VERSION: ${{ inputs.shfmt-version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: |-
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install shfmt
        run: |-
          set -euo pipefail

          DEFAULT_SHFMT_VERSION="v3.8.0"
          if [[ -z "${SHFMT_VERSION:-}" ]]; then
            echo "shfmt version not specified, using default: $DEFAULT_SHFMT_VERSION"
            SHFMT_VERSION="$DEFAULT_SHFMT_VERSION"
          else
            echo "Using shfmt version: $SHFMT_VERSION"
          fi

          # Remove v prefix for asset name, but keep for tag
          SHFMT_VERSION_NOPREFIX="${SHFMT_VERSION#v}"
          shfmt_path="$RUNNER_TEMP/shfmt"

          # Try to get asset name from GitHub API for robustness
          asset_url=$(curl -s "https://api.github.com/repos/mvdan/sh/releases/tags/${SHFMT_VERSION}" | grep browser_download_url | grep linux_amd64 | grep -v .deb | cut -d '"' -f 4 | head -n1)
          if [[ -z "$asset_url" ]]; then
            # Fallback to constructed URL if API fails
            asset_url="https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION_NOPREFIX}_linux_amd64"
            echo "GitHub API did not return asset, falling back to: $asset_url"
          else
            echo "Found shfmt asset via GitHub API: $asset_url"
          fi

          echo "Downloading shfmt from: $asset_url"
          curl -fsSL "$asset_url" -o "$shfmt_path"
          chmod +x "$shfmt_path"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: shfmt (autofix)
        run: |-
          set -euo pipefail

          mapfile -d '' files < <(git ls-files -z '*.sh' || true)
          if [[ "${#files[@]}" -eq 0 ]]; then
            exit 0
          fi

          shfmt -w -i 2 -ci -sr "${files[@]}"

          if ! git diff --quiet; then
            git diff > "$RUNNER_TEMP/code-quality.patch"
            echo "::error title=shfmt required::Run shfmt and commit the changes."
            exit 1
          fi

      - name: Upload patch (shfmt)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-quality-shfmt.patch
          path: ${{ runner.temp }}/code-quality.patch

      - name: Unsafe bash patterns gate
        run: |-
          set -euo pipefail

          mapfile -d '' files < <(git ls-files -z '*.sh' || true)
          if [[ "${#files[@]}" -eq 0 ]]; then
            exit 0
          fi

          bad=0
          for f in "${files[@]}"; do
            if ! head -n 1 "$f" | grep -Eq '^#!.*\bbash\b'; then
              continue
            fi

            header="$(head -n 20 "$f")"
            if ! grep -Fqx 'set -euo pipefail' <<<"$header"; then
              echo "::error title=Unsafe bash::Missing 'set -euo pipefail' in $f"
              bad=1
            fi
            if grep -Eq '(^|[[:space:]])case[[:space:]]' "$f"; then
              if ! grep -Eq '^[[:space:]]*\\*\\)' "$f"; then
                printf '%s\n' "::error title=Unsafe bash::case without default (missing '*)') in $f"
                bad=1
              fi
            fi
          done

          if [[ "$bad" -ne 0 ]]; then
            exit 1
          fi

      - name: shellcheck
        run: |-
          set -euo pipefail

          mapfile -d '' files < <(git ls-files -z '*.sh' || true)
          if [[ "${#files[@]}" -eq 0 ]]; then
            exit 0
          fi

          shellcheck -x "${files[@]}"

