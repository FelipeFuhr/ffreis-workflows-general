name: General / Quality SEO

on:
  workflow_call:
    inputs:
      data-repo:
        description: "Data repository (owner/repo). Required unless skip-build is true."
        required: false
        type: string
        default: ""
      data-ref:
        description: "Data repository ref"
        required: false
        type: string
        default: main
      data-lang:
        description: >
          Language to inject. Empty = flat structure (site.d/ + site.yaml at repo root).
          Non-empty = multi-lang merge: shared/site.d/ + <lang>/site.d/ + <lang>/site.yaml.
        required: false
        type: string
        default: ""
      compiler-repo:
        description: "Compiler repository (owner/repo). Defaults to {owner}/ffreis-website-compiler."
        required: false
        type: string
        default: ""
      base-url:
        description: "Production base URL (e.g. https://ffreis.com). Used to verify canonical and hreflang URLs."
        required: true
        type: string
      enable-structured-data:
        description: "Validate JSON-LD / schema.org structured data"
        required: false
        type: boolean
        default: true
      enable-meta:
        description: "Validate HTML meta-tag completeness (title, description, og:*, canonical, robots)"
        required: false
        type: boolean
        default: true
      enable-hreflang:
        description: "Validate hreflang link structure and reciprocal graph"
        required: false
        type: boolean
        default: true
      enable-canonical:
        description: "Validate canonical URLs are absolute and consistent"
        required: false
        type: boolean
        default: true
      enable-sitemap:
        description: "Validate sitemap.xml structure"
        required: false
        type: boolean
        default: true
      skip-build:
        description: "Skip compiler checkout and build. Use dist-path as the pre-built output."
        required: false
        type: boolean
        default: false
      dist-path:
        description: "Path to pre-built HTML output (used when skip-build is true)."
        required: false
        type: string
        default: dist
      timeout-minutes:
        description: "Maximum minutes before job is cancelled"
        required: false
        type: number
        default: 15
    secrets:
      CI_REPO_READ_TOKEN:
        description: "PAT for checking out private data/compiler repos. Falls back to github.token."
        required: false

permissions:
  contents: read

jobs:
  seo-quality:
    name: SEO Quality
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes || 15 }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # ── Build (skipped when skip-build: true) ─────────────────────────────

      - name: Checkout website compiler
        if: ${{ !inputs.skip-build }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: ${{ inputs.compiler-repo || format('{0}/ffreis-website-compiler', github.repository_owner) }}
          path: website-compiler
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Detect compiler layout
        if: ${{ !inputs.skip-build }}
        id: detect_compiler
        shell: bash
        run: |
          set -euo pipefail
          is_compatible() {
            local dir="$1"
            [[ -f "${dir}/go.mod" ]] || return 1
            [[ -f "${dir}/cmd/website-compiler/main.go" ]] || return 1
            [[ -d "${dir}/cmd/build-static" ]] || return 1
            return 0
          }
          for root in "website-compiler" "website-compiler/ffreis-website-compiler"; do
            if is_compatible "${root}"; then
              echo "compiler_dir=${root}" >> "$GITHUB_OUTPUT"
              echo "go_mod=${root}/go.mod" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Could not detect a compatible compiler checkout." >&2; exit 1

      - name: Checkout website data
        if: ${{ !inputs.skip-build }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: ${{ inputs.data-repo }}
          ref: ${{ inputs.data-ref }}
          path: website-data
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Go
        if: ${{ !inputs.skip-build }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: ${{ steps.detect_compiler.outputs.go_mod }}
          cache: true

      - name: Inject data and build
        if: ${{ !inputs.skip-build }}
        env:
          DATA_LANG: ${{ inputs.data-lang }}
          COMPILER_DIR: ${{ steps.detect_compiler.outputs.compiler_dir }}
        run: |
          set -euo pipefail
          mkdir -p src/data/site.d
          if [[ -z "$DATA_LANG" ]]; then
            # Flat structure: site.d/ and site.yaml at repo root
            cp -r website-data/site.d/. src/data/site.d/
            cp website-data/site.yaml src/data/
          else
            # Multi-lang: merge shared/ then lang-specific
            if [[ -d "website-data/shared/site.d" ]]; then
              cp -r website-data/shared/site.d/. src/data/site.d/
            fi
            cp -r "website-data/${DATA_LANG}/site.d/." src/data/site.d/
            cp "website-data/${DATA_LANG}/site.yaml" src/data/
          fi
          mkdir -p dist
          go -C "$COMPILER_DIR" run ./cmd/build-static \
            -website-root "$GITHUB_WORKSPACE" \
            -out "$GITHUB_WORKSPACE/dist"

      # ── SEO Checks ────────────────────────────────────────────────────────

      - name: Validate structured data (JSON-LD)
        if: ${{ inputs.enable-structured-data }}
        env:
          DIST_PATH: ${{ inputs.skip-build && inputs.dist-path || 'dist' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, re, sys
          dist = pathlib.Path(os.environ["DIST_PATH"])
          errors = []
          count = 0
          for f in sorted(dist.rglob("*.html")):
              html = f.read_text(encoding="utf-8", errors="replace")
              for m in re.finditer(
                  r'<script[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
                  html, re.DOTALL | re.IGNORECASE
              ):
                  count += 1
                  raw = m.group(1).strip()
                  try:
                      obj = json.loads(raw)
                  except json.JSONDecodeError as e:
                      errors.append(f"{f.name}: invalid JSON-LD: {e}")
                      continue
                  if "schema.org" not in str(obj.get("@context", "")):
                      errors.append(f"{f.name}: JSON-LD @context missing schema.org")
                  if "@type" not in obj:
                      errors.append(f"{f.name}: JSON-LD missing @type")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"structured-data: OK ({count} blocks across {len(list(dist.rglob('*.html')))} pages)")
          PYEOF

      - name: Validate HTML meta completeness
        if: ${{ inputs.enable-meta }}
        env:
          DIST_PATH: ${{ inputs.skip-build && inputs.dist-path || 'dist' }}
        run: |
          python3 - <<'PYEOF'
          import html.parser, os, pathlib, sys

          class MetaCollector(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags, self.title_text, self._in_title = {}, None, False
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "title": self._in_title = True
                  elif tag == "meta":
                      key = a.get("name", a.get("property", ""))
                      if key: self.tags[key.lower()] = a.get("content", "")
                  elif tag == "link" and a.get("rel") == "canonical":
                      self.tags["canonical"] = a.get("href", "")
              def handle_data(self, d):
                  if self._in_title: self.title_text = (self.title_text or "") + d
              def handle_endtag(self, tag):
                  if tag == "title": self._in_title = False

          REQUIRED = [
              ("title",          lambda p: p.title_text and p.title_text.strip(),   "empty or missing <title>"),
              ("description",    lambda p: p.tags.get("description"),               "missing <meta name=description>"),
              ("canonical",      lambda p: p.tags.get("canonical","").startswith("http"), "missing or relative canonical"),
              ("robots",         lambda p: "robots" in p.tags,                      "missing <meta name=robots>"),
              ("og:title",       lambda p: p.tags.get("og:title"),                  "missing og:title"),
              ("og:description", lambda p: p.tags.get("og:description"),            "missing og:description"),
              ("og:image",       lambda p: p.tags.get("og:image","").startswith("http"), "missing or relative og:image"),
          ]

          dist = pathlib.Path(os.environ["DIST_PATH"])
          errors = []
          for f in sorted(dist.rglob("*.html")):
              p = MetaCollector()
              p.feed(f.read_text(encoding="utf-8", errors="replace"))
              for _, check, msg in REQUIRED:
                  if not check(p):
                      errors.append(f"{f.name}: {msg}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"meta: OK ({len(list(dist.rglob('*.html')))} pages)")
          PYEOF

      - name: Validate hreflang structure and reciprocal graph
        if: ${{ inputs.enable-hreflang }}
        env:
          DIST_PATH: ${{ inputs.skip-build && inputs.dist-path || 'dist' }}
          BASE_URL: ${{ inputs.base-url }}
        run: |
          python3 - <<'PYEOF'
          import html.parser, os, pathlib, sys, urllib.parse

          class HreflangCollector(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.entries = {}  # {lang: href}
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "link" and a.get("rel") == "alternate" and "hreflang" in a:
                      self.entries[a["hreflang"]] = a.get("href", "")

          dist = pathlib.Path(os.environ["DIST_PATH"])
          base_url = os.environ["BASE_URL"].rstrip("/")
          errors = []

          # Collect hreflang entries per page
          page_hreflang = {}  # {filepath: {lang: href}}
          for f in sorted(dist.rglob("*.html")):
              c = HreflangCollector()
              c.feed(f.read_text(encoding="utf-8", errors="replace"))
              if c.entries:
                  page_hreflang[f] = c.entries

          if not page_hreflang:
              print("hreflang: no hreflang entries found — skipping")
              sys.exit(0)

          # Per-page checks
          for f, entries in page_hreflang.items():
              for lang, href in entries.items():
                  if not href.startswith("http"):
                      errors.append(f"{f.name}: hreflang[{lang}] is not an absolute URL: {href!r}")
              if "x-default" not in entries:
                  errors.append(f"{f.name}: hreflang set is missing x-default")

          # Consistency: all pages should declare the same set of language tags
          lang_sets = {f: frozenset(e.keys()) for f, e in page_hreflang.items()}
          canonical_set = next(iter(lang_sets.values()))
          for f, ls in lang_sets.items():
              if ls != canonical_set:
                  errors.append(
                      f"{f.name}: hreflang lang set {sorted(ls)} differs from "
                      f"{sorted(canonical_set)} (first seen in {next(iter(lang_sets)).name})"
                  )

          # Reciprocal check: for each hreflang URL that maps to a local file,
          # verify that file also references back with a matching hreflang entry.
          def href_to_local(href):
              """Convert an absolute href to a local dist/ path, or None."""
              if not href.startswith(base_url):
                  return None
              rel = href[len(base_url):].lstrip("/")
              for candidate in [
                  dist / (rel.rstrip("/") + "/index.html"),  # /about/ → about/index.html
                  dist / (rel or "index.html"),               # exact file path
                  dist / (rel.rstrip("/") + ".html"),         # /about/ → about.html
              ]:
                  if candidate.is_file():
                      return candidate
              return None

          # Build: href -> (source_file, lang_in_source)
          href_source = {}
          for f, entries in page_hreflang.items():
              for lang, href in entries.items():
                  if lang != "x-default":
                      href_source.setdefault(href, []).append((f, lang))

          for href, sources in href_source.items():
              target = href_to_local(href)
              if target is None:
                  continue  # external or different deployment — skip
              if target not in page_hreflang:
                  errors.append(
                      f"{target.name}: referenced via hreflang from "
                      f"{sources[0][0].name} but has no hreflang entries"
                  )
                  continue
              target_entries = page_hreflang[target]
              # Every source page should be reachable from target
              for src_file, src_lang in sources:
                  # Find the href that target uses for src_lang
                  if src_lang not in target_entries:
                      errors.append(
                          f"{target.name}: missing hreflang[{src_lang}] "
                          f"(expected to reference back to {src_file.name})"
                      )

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"hreflang: OK ({len(page_hreflang)} pages with hreflang)")
          PYEOF

      - name: Validate canonical URLs
        if: ${{ inputs.enable-canonical }}
        env:
          DIST_PATH: ${{ inputs.skip-build && inputs.dist-path || 'dist' }}
          BASE_URL: ${{ inputs.base-url }}
        run: |
          python3 - <<'PYEOF'
          import html.parser, os, pathlib, sys

          class CanonicalCollector(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.canonical = None
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "link" and a.get("rel") == "canonical":
                      self.canonical = a.get("href", "")

          dist = pathlib.Path(os.environ["DIST_PATH"])
          base_url = os.environ["BASE_URL"].rstrip("/")
          errors = []
          for f in sorted(dist.rglob("*.html")):
              c = CanonicalCollector()
              c.feed(f.read_text(encoding="utf-8", errors="replace"))
              if c.canonical is None:
                  errors.append(f"{f.name}: missing canonical link")
              elif not c.canonical.startswith("http"):
                  errors.append(f"{f.name}: canonical is not absolute: {c.canonical!r}")
              elif not c.canonical.startswith(base_url):
                  errors.append(
                      f"{f.name}: canonical {c.canonical!r} does not start with base URL {base_url!r}"
                  )

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"canonical: OK ({len(list(dist.rglob('*.html')))} pages)")
          PYEOF

      - name: Validate sitemap XML
        if: ${{ inputs.enable-sitemap }}
        env:
          DIST_PATH: ${{ inputs.skip-build && inputs.dist-path || 'dist' }}
          BASE_URL: ${{ inputs.base-url }}
        run: |
          python3 - <<'PYEOF'
          import os, pathlib, sys, xml.etree.ElementTree as ET

          dist = pathlib.Path(os.environ["DIST_PATH"])
          base_url = os.environ["BASE_URL"].rstrip("/")
          sitemap = dist / "sitemap.xml"
          errors = []

          if not sitemap.exists():
              print("sitemap: no sitemap.xml found — skipping", file=sys.stderr)
              # Not a hard failure: sites may not generate one
              sys.exit(0)

          try:
              tree = ET.parse(sitemap)
          except ET.ParseError as e:
              print(f"sitemap: invalid XML: {e}", file=sys.stderr)
              sys.exit(1)

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = tree.findall(".//sm:loc", ns)
          if not urls:
              errors.append("sitemap: no <loc> elements found")

          for loc in urls:
              href = (loc.text or "").strip()
              if not href.startswith("http"):
                  errors.append(f"sitemap: non-absolute <loc>: {href!r}")
              elif not href.startswith(base_url):
                  errors.append(f"sitemap: <loc> {href!r} does not start with base URL {base_url!r}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"sitemap: OK ({len(urls)} URLs)")
          PYEOF
