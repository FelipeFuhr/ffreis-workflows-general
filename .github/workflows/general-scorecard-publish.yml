name: General / OSSF Scorecard Publish

# Scan + optional SARIF upload + PUBLISH to the OpenSSF REST API (enables the badge).
# Split out of general-scorecard.yml so that SCAN-ONLY callers of that workflow need NOT
# grant id-token:write. THIS workflow's job declares id-token:write, so every caller of
# THIS workflow must grant it (publishers already do). Publishing only makes sense on the
# default branch, so the job is gated off for pull_request events.

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: Upload SARIF to GitHub code scanning
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
          Self-hosted homelab box (private repos only): '["self-hosted","local"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions: {}

jobs:
  scorecard-publish:
    # Publishing requires the default branch + OIDC; never runs on PRs.
    if: ${{ github.event_name != 'pull_request' }}
    name: OSSF Scorecard (publish)
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      id-token: write
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run OSSF Scorecard and publish results
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_format: sarif
          results_file: scorecard.sarif
          publish_results: true

      - name: Upload SARIF
        if: inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
