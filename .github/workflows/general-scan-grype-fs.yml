name: General / Grype Filesystem Scan

on:
  workflow_call:
    inputs:
      path:
        description: "Directory or image reference to scan"
        required: false
        type: string
        default: "."
      severity:
        description: "Minimum severity that causes a non-zero exit (negligible/low/medium/high/critical)"
        type: string
        default: "high"
      fail-on-vuln:
        description: "If true, fail the workflow when vulnerabilities are found at or above severity"
        type: boolean
        default: false
      upload-sarif:
        description: "Upload SARIF to GitHub code scanning"
        type: boolean
        default: true
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

permissions: {}

jobs:
  grype:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Grype (fs)
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Grype
        run: |
          set -euo pipefail
          PINNED_COMMIT="dee8de483dfba5b4e0bc0aa8e4ab2ce52137e490"
          SCRIPT_URL="https://raw.githubusercontent.com/anchore/grype/${PINNED_COMMIT}/install.sh"
          _grype_tmp="$(mktemp -d)"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            "$SCRIPT_URL" -o /tmp/grype-install.sh
          grep -q "grype" /tmp/grype-install.sh
          sh /tmp/grype-install.sh -b "$_grype_tmp" v0.114.0
          sudo install -m 0755 "$_grype_tmp/grype" /usr/local/bin/grype
          grype version

      - name: Run Grype (filesystem)
        id: grype
        env:
          SCAN_PATH: ${{ inputs.path }}
          SEVERITY: ${{ inputs.severity }}
          FAIL_ON_VULN: ${{ inputs.fail-on-vuln }}
        shell: bash
        run: |
          set -uo pipefail
          # grype's exit-code/output contract, probed against the pinned v0.114.0
          # binary and locked by scripts/test-grype-scan-verdict.sh:
          #
          #   exit 0,     SARIF written -> scan ran; nothing at/above --fail-on
          #   exit 2,     SARIF written -> scan ran; findings at/above --fail-on
          #   exit 1,     SARIF EMPTY   -> grype never completed (bad config, a
          #                                path it cannot resolve, DB failure);
          #                                stderr carries an `ERROR ...` line
          #   exit >= 128, SARIF EMPTY  -> grype was killed by signal exit-128
          #
          # A repo with no package manifests is the FIRST case, not an error:
          # grype writes a valid 358-byte SARIF with an empty `results` array and
          # exits 0. "Nothing to scan" is therefore a pass that must be stated.
          # The old check conflated every case above into "grype.sarif was not
          # generated or is empty", so a YAML-only repo and an OOM-killed scanner
          # produced the same unhelpful error. It also read exit != 0 as
          # "vulnerabilities found", which silently mislabels grype's error code 1.
          #
          # scan-fix(grype:self-scan): exclude grype's own binary — installed to
          # /usr/local/bin/grype (GHA) or /bin/grype (host/act); without this,
          # CVEs in grype's own Go stdlib/docker deps surface as project findings.
          # Patterns are matched relative to the scan root and grype >= 0.114.0
          # rejects absolute exclusions, hence the '**/' prefix.
          #
          # The CycloneDX output answers "did this gate check anything?". A
          # zero-finding SARIF is only trustworthy next to the number of packages
          # cataloged, so both are logged. One scan, two serializers.
          # --- kill attribution ------------------------------------------------
          # grype exits 137 BOTH when the kernel OOM-kills it inside its own
          # cgroup AND when something outside that cgroup tears the runner down
          # (a cancelled run, a pod deletion, a scale-down). The exit code alone
          # cannot separate them, so it must not be used to hand out advice:
          # measured against this pinned v0.114.0 binary, a scan peaks at
          # ~330 MiB RSS even while importing its ~3.1 GiB vulnerability DB,
          # which fits the fleet's smallest 1.5Gi runner four times over. The
          # kernel's own oom_kill counter is the only local witness, so sample it
          # either side of the scan. CGROUP_ROOT exists purely so
          # scripts/test-grype-scan-verdict.sh can point this at a fixture;
          # nothing sets it in a real run.
          # Both helpers return "" for "could not tell" and must NEVER fail:
          # GitHub runs this step under `bash -e -o pipefail`, so a probe that
          # exits non-zero kills the whole scan before grype is even invoked.
          # That is not hypothetical — `du` on a DB cache directory that does
          # not exist yet exits 1, and it took the step down in 10ms.
          cgroup_oom_kills() {
            local f v
            for f in "${CGROUP_ROOT:-/sys/fs/cgroup}/memory.events" \
                     "${CGROUP_ROOT:-/sys/fs/cgroup}/memory/memory.oom_control"; do
              if test -r "$f"; then
                v="$(awk '$1 == "oom_kill" { print $2; hit = 1 } END { if (!hit) print "" }' "$f")" || v=""
                echo "$v"
                return 0
              fi
            done
            # Unreadable is "unknown", never "zero". Claiming no OOM happened
            # because we could not look is the same vacuous verdict this step
            # exists to refuse everywhere else.
            echo ""
          }
          grype_db_dir() {
            if test -n "${GRYPE_DB_CACHE_DIR:-}"; then
              echo "${GRYPE_DB_CACHE_DIR}"
            elif test -n "${XDG_CACHE_HOME:-}"; then
              echo "${XDG_CACHE_HOME}/grype/db"
            else
              echo "${HOME:-/root}/.cache/grype/db"
            fi
          }
          db_bytes() {
            local d n
            d="$(grype_db_dir)"
            if ! test -d "$d"; then
              echo ""
              return 0
            fi
            n="$(du -sb "$d" 2>/dev/null | cut -f1)" || n=""
            echo "$n"
          }
          oom_before="$(cgroup_oom_kills)"
          db_before="$(db_bytes)"

          sbom_json="$(mktemp -d)/grype-sbom.json"
          # GHA invokes bash with -e, so a non-zero grype exit would kill the
          # shell before the code could be captured; && / || keeps it alive.
          grype "dir:${SCAN_PATH}" \
            --exclude '**/bin/grype' \
            --exclude '**/usr/local/bin/grype' \
            --exclude '**/usr/bin/grype' \
            --fail-on "$SEVERITY" \
            -o "sarif=grype.sarif" \
            -o "cyclonedx-json=${sbom_json}" \
            2> grype.stderr.log \
            && exit_code=0 \
            || exit_code=$?

          dump_stderr() {
            if test -s grype.stderr.log; then
              echo "::group::grype stderr (tail)"
              tail -n 200 grype.stderr.log || true
              echo "::endgroup::"
            fi
          }

          if ! test -s grype.sarif; then
            # No report at all: the scan did NOT run, so this can never pass.
            if [[ "$exit_code" -ge 128 ]]; then
              oom_after="$(cgroup_oom_kills)"
              signal=$((exit_code - 128))
              mem_max="$(head -n1 "${CGROUP_ROOT:-/sys/fs/cgroup}/memory.max" 2>/dev/null || true)"
              if [[ -n "$oom_before" && -n "$oom_after" && "$oom_after" -gt "$oom_before" ]]; then
                echo "::error::grype was killed by signal ${signal} and this cgroup's oom_kill counter rose ${oom_before} -> ${oom_after} — the scan was OOM-killed inside its own memory limit (memory.max=${mem_max:-unknown}). This one IS a capacity problem: give the caller a larger runner class, e.g. runner: '[\"self-hosted\",\"local\",\"heavy\"]' (3Gi) in place of the 1.5Gi default."
              elif [[ -n "$oom_before" && -n "$oom_after" ]]; then
                echo "::error::grype was killed by signal ${signal} but this cgroup's oom_kill counter did NOT move (still ${oom_after}) — the scan was terminated from OUTSIDE its memory limit: a cancelled run, a pod deletion or a runner scale-down. A larger runner class will NOT fix this; re-dispatch the run."
              else
                echo "::error::grype was killed by signal ${signal} before writing a report — the scan did not run. This runner exposes no cgroup oom_kill counter, so an OOM kill and an external termination cannot be told apart here; do not assume either."
              fi
            else
              reason=""
              if test -s grype.stderr.log; then
                reason="$(grep -m1 'ERROR' grype.stderr.log | tr -d '\r')"
              fi
              echo "::error::grype failed to run (exit ${exit_code}) and wrote no report: ${reason:-<no error text captured>}"
            fi
            dump_stderr
            exit 1
          fi

          census="$(SARIF_PATH=grype.sarif SBOM_PATH="$sbom_json" python3 - <<'PY'
          import json
          import os
          import pathlib

          sarif = json.loads(pathlib.Path(os.environ["SARIF_PATH"]).read_text())
          findings = sum(len(run.get("results") or []) for run in sarif.get("runs") or [])
          sbom = pathlib.Path(os.environ["SBOM_PATH"])
          packages = 0
          if sbom.is_file() and sbom.stat().st_size:
              packages = len(json.loads(sbom.read_text()).get("components") or [])
          print(findings, packages)
          PY
          )" || {
            echo "::error::grype wrote a report that is not valid JSON — treating as a failed scan, not as zero findings."
            dump_stderr
            exit 1
          }
          findings="${census%% *}"
          packages="${census##* }"

          {
            echo "exit-code=${exit_code}"
            echo "findings=${findings}"
            echo "packages=${packages}"
          } >> "$GITHUB_OUTPUT"

          # 0 = clean, 2 = --fail-on threshold met. Anything else alongside a
          # written report is a grype contract change we must not paper over.
          if [[ "$exit_code" -ne 0 && "$exit_code" -ne 2 ]]; then
            echo "::error::grype wrote a report but exited ${exit_code}, which is neither 'clean' (0) nor 'findings' (2)."
            dump_stderr
            exit 1
          fi

          # Name the DB cost. A clean verdict says what was examined; this says
          # what it was examined AGAINST, and where a multi-minute step over a
          # small tree actually spends itself. Nothing is skipped here — this is
          # disclosure, not a scope reduction.
          db_after="$(db_bytes)"
          if [[ "$db_after" =~ ^[0-9]+$ ]]; then
            db_note="already cached on this runner"
            if [[ ! "$db_before" =~ ^[0-9]+$ ]] || [[ "$db_after" -gt "$db_before" ]]; then
              db_note="fetched during this run"
            fi
            echo "Grype: matched against a $((db_after / 1048576)) MiB vulnerability DB (${db_note})."
          fi

          if [[ "$packages" -eq 0 ]]; then
            echo "Grype: no package manifests found under '${SCAN_PATH}' — 0 packages cataloged, so there is nothing to match against. The scan itself completed (exit ${exit_code}); this gate passes."
          else
            echo "Grype: scan completed — ${packages} package(s) cataloged, ${findings} finding(s) at/above ${SEVERITY}."
          fi
          if [[ "$exit_code" -eq 2 ]]; then
            if [[ "$FAIL_ON_VULN" == "true" ]]; then
              echo "::error::Grype found ${findings} vulnerability finding(s) at/above ${SEVERITY}."
              exit 1
            fi
            echo "::warning::Grype found ${findings} vulnerability finding(s) at/above ${SEVERITY} but fail-on-vuln=false; continuing."
          fi

      - name: Upload SARIF
        if: inputs.upload-sarif && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: grype.sarif
          category: grype-fs
