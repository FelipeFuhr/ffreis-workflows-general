name: General / HTTP Smoke

on:
  workflow_call:
    inputs:
      base-url:
        description: "Base URL (used if SMOKE_BASE_URL secret is not provided)"
        type: string
        default: ""
      paths:
        description: "Newline-separated paths to GET (e.g. /healthz)"
        type: string
        default: |-
          /
      timeout-seconds:
        description: "curl timeout seconds"
        type: number
        default: 20
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'
    secrets:
      SMOKE_BASE_URL:
        required: false

permissions: {}

jobs:
  smoke:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Smoke
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Smoke checks
        shell: bash
        env:
          BASE_SECRET: ${{ secrets.SMOKE_BASE_URL }}
          BASE_INPUT: ${{ inputs.base-url }}
          PATHS: ${{ inputs.paths }}
          TIMEOUT: ${{ inputs.timeout-seconds }}
        run: |
          set -euo pipefail
          base=""
          if [[ -n "$BASE_SECRET" ]]; then
            base="$BASE_SECRET"
          elif [[ -n "$BASE_INPUT" ]]; then
            base="$BASE_INPUT"
          fi
          [[ -n "$base" ]] || (echo "Missing base URL (set SMOKE_BASE_URL secret or inputs.base-url)" >&2; exit 1)
          while IFS= read -r p; do
            [[ -z "$p" ]] && continue
            if [[ "$p" != /* ]]; then
              p="/$p"
            fi
            url="${base%/}${p}"
            echo "GET $url"
            curl -fsS --max-time "$TIMEOUT" "$url" >/dev/null
          done <<< "$PATHS"
