name: General / SBOM

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the SBOM artifact to upload"
        required: false
        type: string
        default: "sbom"
      format:
        description: "SBOM output format (spdx-json/cyclonedx-json/cyclonedx)"
        required: false
        type: string
        default: "spdx-json"
      path:
        description: "Path to scan for SBOM generation"
        required: false
        type: string
        default: "."
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

jobs:
  sbom:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The v0.17.0 SHA previously pinned here was orphaned upstream (404s on
      # anchore/sbom-action) and broke this job fleet-wide (every SBOM run
      # failed with "unable to resolve action"); re-pinned to the current
      # release's real commit, verified via `git ls-remote`.
      - name: Generate SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          path: ${{ inputs.path }}
          format: ${{ inputs.format }}
          artifact-name: ${{ inputs.artifact-name }}
          upload-artifact: true
          upload-release-assets: false
