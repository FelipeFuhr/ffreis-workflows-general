name: DevOps / Automation

on:
  schedule:
    - cron: "35 3 8 * *"  # monthly scattered (was: 0 3 * * 0)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scorecard:
    if: |
      vars.SCORECARD_ENABLED != 'false' &&
      github.event_name != 'pull_request' &&
      (vars.FLEET_SPOT_CI != 'true' || github.event_name == 'workflow_dispatch')
    # security-events: write required for SARIF/code scanning upload (GitHub code scanning integration)
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/general-scorecard.yml
    with:
      upload-sarif: true
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  stale:
    if: |
      vars.STALE_ENABLED != 'false' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (vars.FLEET_SPOT_CI != 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/general-stale.yml
    with:
      only: "both"
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  release-please:
    if: vars.RELEASE_PLEASE_ENABLED != 'false' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/general-release-please.yml
    with:
      target-branch: "main"
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
