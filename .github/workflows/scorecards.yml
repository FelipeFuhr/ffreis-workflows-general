name: Scorecard supply-chain security
on:
  branch_protection_rule:
  schedule:
    - cron: '42 9 19 * *'  # monthly scattered
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/general-scorecard.yml
    with:
      upload-sarif: true
