name: General / Trivy Filesystem Scan

on:
  workflow_call:
    inputs:
      scan-ref:
        description: "Directory to scan"
        type: string
        default: "."
      fail-on-vuln:
        description: "Fail the workflow if vulnerabilities are found at or above severity"
        type: boolean
        default: false
      upload-sarif:
        description: "Upload SARIF to GitHub code scanning"
        type: boolean
        default: true
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions: {}

jobs:
  trivy:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Trivy (fs)
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-ref }}
          exit-code: ${{ inputs.fail-on-vuln && 1 || 0 }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif

      - name: Validate SARIF output
        shell: bash
        run: |
          set -euo pipefail
          test -s trivy.sarif || (echo "trivy.sarif was not generated or is empty" >&2 && exit 1)

      - name: Upload SARIF
        if: inputs.upload-sarif && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
