name: General / OSV-Scanner

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan
        required: false
        type: string
        default: .
      osv-scanner-version:
        description: osv-scanner version to install (without leading v)
        required: false
        type: string
        default: "2.4.0"
      upload-sarif:
        description: Upload SARIF to GitHub code scanning
        required: false
        type: boolean
        default: false
      fail-on-vuln:
        description: Fail the workflow if vulnerabilities are found
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
        required: false
        type: string
        default: '["ubuntu-latest"]'

concurrency:
  # Distinct group (literal "osv" infix) so this never matches a caller's
  # ${{ github.workflow }}-${{ github.ref }} group. When invoked via
  # workflow_call, github.workflow resolves to the CALLER's name, so an
  # identical group would deadlock the run.
  group: ${{ github.workflow }}-osv-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# We run the osv-scanner binary directly rather than google/osv-scanner-action's
# reusable workflow: that reusable pulls in actions/download-artifact pinned to a
# TAG, which repos with `sha_pinning_required` reject (startup_failure). A direct
# binary download has no nested action to pin.
jobs:
  osv-scanner:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: OSV-Scanner
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes || 15 }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install osv-scanner
        env:
          OSV_VERSION: ${{ inputs.osv-scanner-version || '2.4.0' }}
        run: |
          set -euo pipefail
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          sudo curl -fsSL "$url" -o /usr/local/bin/osv-scanner
          sudo chmod 0755 /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run OSV-Scanner
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          FAIL_ON_VULN: ${{ inputs.fail-on-vuln }}
        run: |
          # GitHub invokes Bash with `-e`; turn it off while collecting OSV's
          # documented result code, otherwise a non-zero scan exits before the
          # policy below can decide whether it is actionable.
          set +e
          osv-scanner scan source --recursive --format sarif \
            --output-file "${GITHUB_WORKSPACE}/osv-scanner.sarif" "$WORKING_DIRECTORY"
          rc=$?
          set -euo pipefail
          # osv-scanner exit codes: 0 = no vulnerabilities, 1 = vulnerabilities
          # found. A source tree without a supported package manifest returns
          # 128; that is an inapplicable scan, not a vulnerability or failure.
          if [[ "$rc" -eq 0 ]]; then
            echo "OSV-Scanner: no known vulnerabilities."
          elif [[ "$rc" -eq 1 ]]; then
            echo "OSV-Scanner: known vulnerabilities found."
            if [[ "$FAIL_ON_VULN" == "true" ]]; then
              exit 1
            fi
          elif [[ "$rc" -eq 128 ]]; then
            echo "OSV-Scanner: no supported package source found; skipping."
          else
            echo "OSV-Scanner: scanner error (exit ${rc})."
            exit "$rc"
          fi

      - name: Upload SARIF
        if: inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner
