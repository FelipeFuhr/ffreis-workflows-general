name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows-policy:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-workflows-policy.yml@fcec4030a47caad22222434804950ab56561641a # main

  actionlint:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-actionlint.yml@fcec4030a47caad22222434804950ab56561641a # main

  osv-scanner:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-osv-scanner.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      working-directory: .
      upload-sarif: true

  semantic-pr:
    if: github.event_name == 'pull_request'
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-semantic-pr.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      title: "feat: self-test"

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-labeler.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      dry-run: true
      changed-files: |
        examples/hello/index.js
      rules-json: |-
        [
          {"label":"example","patterns":["examples/**"]},
          {"label":"js","patterns":["**/*.js"]}
        ]

  shellcheck:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-shellcheck.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      working-directory: .

  code-quality:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-code-quality.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      working-directory: examples/hello
      enable-go: false
      enable-shell: true

  pre-commit:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-pre-commit.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      working-directory: .
      require-config: false

  stale:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-stale.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      dry-run: true
      stale-days: 1
      close-days: 1

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-release-please.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      dry-run: true
      config-file: examples/hello/release-please-config.json
      manifest-file: examples/hello/release-please-manifest.json

  scorecard:
    # security-events: write required for SARIF/code scanning upload (GitHub code scanning integration)
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scorecard.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      upload-sarif: true

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      languages: actions
      source-root: .github/workflows
      upload-sarif: false

  trivy-fs:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scan-trivy-fs.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      scan-ref: examples/hello
      upload-sarif: false

  grype-fs:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scan-grype-fs.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      path: examples/hello
      upload-sarif: false

  run-commands:
    permissions:
      actions: read
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-run-commands.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      working-directory: examples/hello
      timeout-minutes: 5
      commands: |-
        set -euo pipefail
        test -f index.js
        node --version >/dev/null

  http-smoke:
    permissions:
      actions: read
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-http-smoke.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      base-url: "https://example.com"
      paths: |-
        /
      timeout-seconds: 20

  lefthook-minimal:
    permissions:
      actions: read
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-lefthook.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      working-directory: examples/hello
      install-golangci-lint: false
      install-gitleaks: false
      stage-files: false
      lefthook-bootstrap-command: ":"
      run-pre-commit: false
      run-commit-msg: false
      run-pre-push: false

  gitleaks:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-gitleaks.yml@fcec4030a47caad22222434804950ab56561641a # main
    with:
      working-directory: .
      gitleaks-version: "8.30.1"
      upload-sarif: false
