name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/general-stale.yml
    with:
      dry-run: true
      stale-days: 1
      close-days: 1

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/general-release-please.yml
    with:
      dry-run: true
      config-file: examples/hello/release-please-config.json
      manifest-file: examples/hello/release-please-manifest.json

  scorecard:
    # security-events: write required for SARIF/code scanning upload (GitHub code scanning integration)
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-scorecard.yml
    with:
      upload-sarif: true

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-codeql.yml
    with:
      languages: actions
      source-root: .github/workflows
      upload-sarif: false

  # trivy-fs + grype-fs + gitleaks self-tests removed: superseded by security-fs
  # (the consolidated bundle exercises all three). Also keeps ci.yml within
  # GitHub's 20-reusable-workflows-per-file limit (was 23 -> startup_failure).
