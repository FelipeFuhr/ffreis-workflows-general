name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  workflows-policy:
    permissions:
      contents: read
    uses: ./.github/workflows/general-workflows-policy.yml
    with:
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  actionlint:
    permissions:
      contents: read
    uses: ./.github/workflows/general-actionlint.yml
    with:
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  ci-local-coverage:
    permissions:
      contents: read
    uses: ./.github/workflows/general-ci-local-coverage.yml
    with:
      mode: defines
      enforce: true
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  osv-scanner:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-osv-scanner.yml
    with:
      working-directory: .
      upload-sarif: true
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  semantic-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/general-semantic-pr.yml
    with:
      title: "feat: self-test"
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
      contents: read
    uses: ./.github/workflows/general-labeler.yml
    with:
      dry-run: true
      changed-files: |
        examples/hello/index.js
      rules-json: |-
        [
          {"label":"example","patterns":["examples/**"]},
          {"label":"js","patterns":["**/*.js"]}
        ]
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  shellcheck:
    permissions:
      contents: read
    uses: ./.github/workflows/general-shellcheck.yml
    with:
      working-directory: .
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  config-validate:
    permissions:
      contents: read
    uses: ./.github/workflows/general-config-validate.yml
    with:
      working-directory: examples/hello
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  ansible-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/general-ansible-lint.yml
    with:
      working-directory: examples/hello/ansible

  code-quality:
    permissions:
      contents: read
    uses: ./.github/workflows/general-code-quality.yml
    with:
      working-directory: .
      enable-shell: false
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  code-quality-examples:
    permissions:
      contents: read
    uses: ./.github/workflows/general-code-quality.yml
    with:
      working-directory: examples/hello
      enable-go: false
      enable-shell: true
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  pre-commit:
    permissions:
      contents: read
    uses: ./.github/workflows/general-pre-commit.yml
    with:
      working-directory: .
      require-config: false
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  stale:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/general-stale.yml
    with:
      dry-run: true
      stale-days: 1
      close-days: 1
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/general-release-please.yml
    with:
      dry-run: true
      config-file: examples/hello/release-please-config.json
      manifest-file: examples/hello/release-please-manifest.json
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  scorecard:
    # scan-only — general-scorecard.yml no longer needs id-token (publish was split out).
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-scorecard.yml
    with:
      upload-sarif: true
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  scorecard-publish:
    # Self-test for the publish workflow. Its job is gated off on pull_request, so this
    # exercises the workflow_call interface (incl. the id-token grant) without publishing.
    permissions:
      id-token: write
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-scorecard-publish.yml
    with:
      upload-sarif: false
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-codeql.yml
    with:
      languages: go
      source-root: examples/hello/codeql-go
      upload-sarif: false
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  # trivy-fs + grype-fs + gitleaks self-tests removed: superseded by security-fs
  # (the consolidated bundle exercises all three). Also keeps ci.yml within
  # GitHub's 20-reusable-workflows-per-file limit (was 23 -> startup_failure).
  security-fs:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-security-fs.yml
    with:
      working-directory: examples/hello
      upload-sarif: false
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  grype-pr-diff:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    uses: ./.github/workflows/general-grype-pr-diff.yml
    with:
      upload-sarif: false
      manifest-patterns: |
        examples/hello/package.json
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  run-commands:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/general-run-commands.yml
    with:
      working-directory: examples/hello
      timeout-minutes: 5
      commands: |-
        set -euo pipefail
        test -f index.js
        node --version >/dev/null
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  http-smoke:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/general-http-smoke.yml
    with:
      base-url: "https://example.com"
      paths: |-
        /
      timeout-seconds: 20
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  lefthook-minimal:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/general-lefthook.yml
    with:
      working-directory: examples/hello
      install-golangci-lint: false
      install-gitleaks: false
      stage-files: false
      lefthook-bootstrap-command: ":"
      run-pre-commit: false
      run-commit-msg: false
      run-pre-push: false
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  lefthook-complex:
    # Exercises general-lefthook-complex.yml against this repo's own root
    # lefthook.yml (which carries self-test complex/release stub groups).
    permissions:
      contents: read
    uses: ./.github/workflows/general-lefthook-complex.yml
    with:
      working-directory: .
      tier: complex
      setup-go: false
      install-golangci-lint: false
      install-govulncheck: false
      install-gitleaks: false
      lefthook-bootstrap-command: "mkdir -p .bin && curl -fsSL https://github.com/evilmartians/lefthook/releases/download/v1.7.10/lefthook_1.7.10_Linux_x86_64 -o .bin/lefthook && chmod +x .bin/lefthook"
      lefthook-bin: ".bin/lefthook"
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'


  semgrep:
    permissions:
      contents: read
    uses: ./.github/workflows/general-semgrep.yml
    with:
      working-directory: examples/hello
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  website-dispatch:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
    uses: ./.github/workflows/general-website-dispatch.yml
    with:
      website_name: hello
      dry_run: true
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'
    secrets:
      DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
