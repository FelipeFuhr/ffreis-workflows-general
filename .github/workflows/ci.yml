name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows-policy:
    permissions:
      contents: read
    uses: ./.github/workflows/general-workflows-policy.yml

  actionlint:
    permissions:
      contents: read
    uses: ./.github/workflows/general-actionlint.yml

  osv-scanner:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-osv-scanner.yml
    with:
      working-directory: .
      upload-sarif: true

  semantic-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/general-semantic-pr.yml
    with:
      title: "feat: self-test"

  semantic-pr-with-scope:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/general-semantic-pr.yml
    with:
      title: "fix(ci): self-test with scope"

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
      contents: read
    uses: ./.github/workflows/general-labeler.yml
    with:
      dry-run: true
      changed-files: |
        examples/hello/index.js
      rules-json: |-
        [
          {"label":"example","patterns":["examples/**"]},
          {"label":"js","patterns":["**/*.js"]}
        ]

  shellcheck:
    permissions:
      contents: read
    uses: ./.github/workflows/general-shellcheck.yml
    with:
      working-directory: .

  code-quality:
    permissions:
      contents: read
    uses: ./.github/workflows/general-code-quality.yml
    with:
      working-directory: .
      enable-shell: false

  code-quality-examples:
    permissions:
      contents: read
    uses: ./.github/workflows/general-code-quality.yml
    with:
      working-directory: examples/hello
      enable-go: false
      enable-shell: true

  pre-commit:
    permissions:
      contents: read
    uses: ./.github/workflows/general-pre-commit.yml
    with:
      working-directory: .
      require-config: false

  stale:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/general-stale.yml
    with:
      dry-run: true
      stale-days: 1
      close-days: 1

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/general-release-please.yml
    with:
      dry-run: true
      config-file: examples/hello/release-please-config.json
      manifest-file: examples/hello/release-please-manifest.json

  scorecard:
    # security-events: write required for SARIF/code scanning upload (GitHub code scanning integration)
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-scorecard.yml
    with:
      upload-sarif: true

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-codeql.yml
    with:
      languages: actions
      source-root: .github/workflows
      upload-sarif: false

  trivy-fs:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-scan-trivy-fs.yml
    with:
      scan-ref: examples/hello
      upload-sarif: false

  grype-fs:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-scan-grype-fs.yml
    with:
      path: examples/hello
      upload-sarif: false

  security-fs:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-security-fs.yml
    with:
      working-directory: examples/hello
      upload-sarif: false

  run-commands:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/general-run-commands.yml
    with:
      working-directory: examples/hello
      timeout-minutes: 5
      commands: |-
        set -euo pipefail
        test -f index.js
        node --version >/dev/null

  http-smoke:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/general-http-smoke.yml
    with:
      base-url: "https://example.com"
      paths: |-
        /
      timeout-seconds: 20

  lefthook-minimal:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/general-lefthook.yml
    with:
      working-directory: examples/hello
      install-golangci-lint: false
      install-gitleaks: false
      stage-files: false
      lefthook-bootstrap-command: ":"
      run-pre-commit: false
      run-commit-msg: false
      run-pre-push: false

  semgrep:
    permissions:
      contents: read
    uses: ./.github/workflows/general-semgrep.yml
    with:
      working-directory: examples/hello

  website-dispatch:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
    uses: ./.github/workflows/general-website-dispatch.yml
    with:
      website_name: hello
      dry_run: true
    secrets:
      DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  gitleaks:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-gitleaks.yml
    with:
      working-directory: .
      gitleaks-version: "8.30.1"
      upload-sarif: false
