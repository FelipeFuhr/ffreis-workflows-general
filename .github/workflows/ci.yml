name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows-policy:
    permissions:
      contents: read
    uses: ./.github/workflows/general-workflows-policy.yml

  osv-scanner:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-osv-scanner.yml
    with:
      working-directory: .
      upload-sarif: true

  semantic-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/general-semantic-pr.yml
    with:
      title: "feat: self-test"

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
      contents: read
    uses: ./.github/workflows/general-labeler.yml
    with:
      dry-run: true
      changed-files: |
        examples/hello/index.js
      rules-json: |-
        [
          {"label":"example","patterns":["examples/**"]},
          {"label":"js","patterns":["**/*.js"]}
        ]

  code-quality:
    permissions:
      contents: read
    uses: ./.github/workflows/general-code-quality.yml
    with:
      working-directory: .
      enable-shell: false

  code-quality-examples:
    permissions:
      contents: read
    uses: ./.github/workflows/general-code-quality.yml
    with:
      working-directory: examples/hello
      enable-go: false
      enable-shell: true

  pre-commit:
    permissions:
      contents: read
    uses: ./.github/workflows/general-pre-commit.yml
    with:
      working-directory: .
      require-config: false

