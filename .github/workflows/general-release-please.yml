name: General / release-please

on:
  workflow_call:
    inputs:
      dry-run:
        description: If true, validates config files and exits without creating PRs/releases
        required: false
        type: boolean
        default: false
      config-file:
        description: Path to release-please config file (for manifest mode)
        required: false
        type: string
        default: ".release-please-config.json"
      manifest-file:
        description: Path to release-please manifest file (for manifest mode)
        required: false
        type: string
        default: ".release-please-manifest.json"
      target-branch:
        description: Target branch for release PRs/releases
        required: false
        type: string
        default: "main"
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label. Default: GitHub-hosted ubuntu-latest.
          For scheduled cron jobs on AWS Spot: '["self-hosted","spot","linux","x64"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: Optional token (PAT) to run release-please; defaults to github.token
        required: false

permissions: {}

jobs:
  release-please:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate config (dry-run)
        if: inputs.dry-run
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
        run: |
          set -euo pipefail
          test -f "$CONFIG_FILE" || { echo "ERROR: missing $CONFIG_FILE"; exit 1; }
          test -f "$MANIFEST_FILE" || { echo "ERROR: missing $MANIFEST_FILE"; exit 1; }
          python3 -m json.tool "$CONFIG_FILE" >/dev/null
          python3 -m json.tool "$MANIFEST_FILE" >/dev/null
          echo "release-please dry-run: config files are valid JSON."

      - name: Run release-please
        if: "!inputs.dry-run"
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}
