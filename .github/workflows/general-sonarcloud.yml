name: General / SonarCloud

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing sonar-project.properties"
        required: false
        type: string
        default: "."
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ["ubuntu-latest"].
          This job is gated to PUBLIC repos (see the job `if:`) and the self-hosted
          pool is org-scoped, so it cannot serve public repos: the previous
          '["self-hosted","local"]' default could never run. Kept as an input for
          symmetry with the rest of the library.
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token"
        required: true

permissions: {}

jobs:
  sonarcloud:
    # SonarCloud analysis of private repos requires a paid plan (free on
    # public repos). SONAR_TOKEN being present doesn't imply entitlement — a
    # private repo without a paid plan gets a 403, not a missing-secret error.
    # Skip cleanly on private so that 403 never fails the check; still runs
    # on public.
    if: |
      github.event.repository.visibility == 'public' && (
        inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false
      )
    name: SonarCloud
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        # Was SonarSource/sonarcloud-github-action, which upstream ARCHIVED in favour
        # of sonarqube-scan-action. Not a routine Renovate bump (AGENTS.md rule 3):
        # the old action is a Docker container action (`runs: using: docker`), so it
        # could never start on the self-hosted pool, which has no container runtime.
        # The replacement is a node24 action and needs none. SONAR_HOST_URL is only
        # required for self-hosted SonarQube Server, not for SonarQube Cloud.
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
