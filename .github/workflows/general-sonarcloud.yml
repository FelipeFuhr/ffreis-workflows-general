name: General / SonarCloud

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing sonar-project.properties"
        required: false
        type: string
        default: "."
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local] (this fleet's runners). Pass '["ubuntu-latest"]' to opt back into GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud token"
        required: true

permissions: {}

jobs:
  sonarcloud:
    # SonarCloud analysis of private repos requires a paid plan (free on
    # public repos). SONAR_TOKEN being present doesn't imply entitlement — a
    # private repo without a paid plan gets a 403, not a missing-secret error.
    # Skip cleanly on private so that 403 never fails the check; still runs
    # on public.
    if: |
      github.event.repository.visibility == 'public' && (
        inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false
      )
    name: SonarCloud
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
