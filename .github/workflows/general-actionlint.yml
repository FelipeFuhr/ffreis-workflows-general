name: General / actionlint

on:
  workflow_call:
    inputs:
      working-directory:
        description: Root directory to scan (expects .github/workflows under it)
        required: false
        type: string
        default: .
      actionlint-version:
        description: actionlint version to install (without leading v)
        required: false
        type: string
        default: 1.7.7
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local] (this fleet's runners). Pass '["ubuntu-latest"]' to opt back into GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

permissions: {}

jobs:
  actionlint:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "$url" -o "$tmp/actionlint.tgz"
          tar -xzf "$tmp/actionlint.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint
          actionlint -version

      - name: Run actionlint
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [[ ! -d ".github/workflows" ]]; then
            echo "ERROR: expected .github/workflows under '$WORKING_DIRECTORY'"
            exit 1
          fi
          actionlint
