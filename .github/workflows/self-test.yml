name: Self Test

on:
  workflow_call:
    inputs:
      dry-run:
        description: If true, validates config files and exits without creating PRs/releases
        required: false
        type: boolean
        default: false
      config-file:
        description: Path to release-please config file (for manifest mode)
        required: false
        type: string
        default: ".release-please-config.json"
      manifest-file:
        description: Path to release-please manifest file (for manifest mode)
        required: false
        type: string
        default: ".release-please-manifest.json"
      target-branch:
        description: Target branch for release PRs/releases
        required: false
        type: string
        default: "main"
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: Optional token (PAT) to run release-please; defaults to github.token
        required: false

permissions: {}

jobs:
  workflows-policy:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: ./.github/workflows/general-workflows-policy.yml


  actionlint:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: ./.github/workflows/general-actionlint.yml
    with:
      working-directory: .

  gitleaks:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-gitleaks.yml
    with:
      working-directory: .
      upload-sarif: true

  osv-scanner:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-osv-scanner.yml
    with:
      working-directory: .
      upload-sarif: true

  semantic-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/general-semantic-pr.yml
    with:
      title: "feat: self-test"

  commit-messages:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/general-commit-messages.yml

  labeler:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/general-labeler.yml
    with:
      dry-run: true
      changed-files: |
        examples/hello/index.js
      rules-json: |-
        [
          {"label":"example","patterns":["examples/**"]},
          {"label":"js","patterns":["**/*.js"]}
        ]

  shellcheck:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: ./.github/workflows/general-shellcheck.yml
    with:
      working-directory: .

  code-quality:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: ./.github/workflows/general-code-quality.yml
    with:
      working-directory: examples/hello
      enable-go: false
      enable-shell: true

  pre-commit:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: ./.github/workflows/general-pre-commit.yml
    with:
      working-directory: .
      require-config: false

  stale:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/general-stale.yml
    with:
      dry-run: true
      stale-days: 1
      close-days: 1

  release-please:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/general-release-please.yml
    with:
      dry-run: true
      config-file: examples/hello/release-please-config.json
      manifest-file: examples/hello/release-please-manifest.json

  scorecard:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: ./.github/workflows/general-scorecard.yml
    with:
      upload-sarif: true

  codeql:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/general-codeql.yml
    with:
      languages: go
      source-root: examples/hello/codeql-go
      upload-sarif: false

  trivy-fs:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-scan-trivy-fs.yml
    with:
      scan-ref: examples/hello
      upload-sarif: false

  grype-fs:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/general-scan-grype-fs.yml
    with:
      path: examples/hello
      upload-sarif: false

  run-commands:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: ./.github/workflows/general-run-commands.yml
    with:
      working-directory: examples/hello
      timeout-minutes: 5
      commands: |-
        set -euo pipefail
        test -f index.js
        node --version >/dev/null

  http-smoke:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: ./.github/workflows/general-http-smoke.yml
    with:
      base-url: "https://example.com"
      paths: |-
        /
      timeout-seconds: 20

  website-dispatch:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
    uses: ./.github/workflows/general-website-dispatch.yml
    with:
      website_name: hello
      dry_run: true
    secrets:
      DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lefthook-minimal:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
    uses: ./.github/workflows/general-lefthook.yml
    with:
      working-directory: examples/hello
      install-golangci-lint: false
      install-gitleaks: false
      stage-files: false
      lefthook-bootstrap-command: ":"
      run-pre-commit: false
      run-commit-msg: false
      run-pre-push: false
