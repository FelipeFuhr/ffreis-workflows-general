name: General / Lefthook

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory (repo root by default)"
        type: string
        default: "."
      go-version:
        description: "Go version (optional; overrides go-version-file)"
        type: string
        default: ""
      go-version-file:
        description: "Go version file (go.mod by default)"
        type: string
        default: "go.mod"
      install-golangci-lint:
        description: "Install golangci-lint (Go)"
        type: boolean
        default: true
      install-govulncheck:
        description: "Install govulncheck (Go)"
        type: boolean
        default: false
      install-gitleaks:
        description: "Install gitleaks"
        type: boolean
        default: true
      gitleaks-version:
        description: "gitleaks version to install (without leading v)"
        type: string
        default: "8.24.2"
      lefthook-bootstrap-command:
        description: "Command to fetch/build lefthook binary (e.g. 'make lefthook-bootstrap')"
        type: string
        default: "make lefthook-bootstrap"
      lefthook-bin:
        description: "Path to lefthook binary (relative to working-directory)"
        type: string
        default: ".bin/lefthook"
      stage-files:
        description: "Stage files before running staged hooks"
        type: boolean
        default: true
      run-pre-commit:
        description: "Run lefthook pre-commit"
        type: boolean
        default: true
      run-commit-msg:
        description: "Run lefthook commit-msg using a temp message"
        type: boolean
        default: true
      run-pre-push:
        description: "Run lefthook pre-push"
        type: boolean
        default: false
      commit-msg-text:
        description: "Commit message used to validate the commit-msg hook"
        type: string
        default: "ci(hooks): validate commit-msg hook"
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

permissions: {}

jobs:
  lefthook:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Lefthook
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        if: inputs.install-golangci-lint || inputs.install-govulncheck
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Install hook tools
        shell: bash
        env:
          INSTALL_GOLANGCI_LINT: ${{ inputs.install-golangci-lint }}
          INSTALL_GOVULNCHECK: ${{ inputs.install-govulncheck }}
          INSTALL_GITLEAKS: ${{ inputs.install-gitleaks }}
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

          if [[ "$INSTALL_GOLANGCI_LINT" == "true" ]]; then
            # Use the official installer script which verifies checksums (avoids go install without go.sum lockfile).
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
              | sh -s -- -b "${HOME}/.local/bin" v2.11.4
          fi

          if [[ "$INSTALL_GOVULNCHECK" == "true" ]]; then
            # Pin to a specific version; govulncheck has no binary release so go install is the only method.
            GOBIN="${HOME}/.local/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          fi

          if [[ "$INSTALL_GITLEAKS" == "true" ]]; then
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "${HOME}/.local/bin" gitleaks
          fi

      - name: Stage files for staged hooks
        if: inputs.stage-files
        run: git add -A

      - name: Bootstrap lefthook
        shell: bash
        env:
          BOOTSTRAP: ${{ inputs.lefthook-bootstrap-command }}
        run: |
          set -euo pipefail
          eval "$BOOTSTRAP" # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection

      # Hooks that come from a `remotes:` block do NOT run without this. In lefthook
      # 1.x only `install` fetches remote configs into .git/info/lefthook-remotes;
      # `run` reads that cache but never populates it. A CI checkout is always a cold
      # clone, so before this step every remote-sourced command was silently skipped
      # and the job still exited 0 — a green check that validated nothing. Measured on
      # a fresh clone of a consumer: `run pre-commit` alone executed 0 commands;
      # `install` then `run` executed all 9. (2.1.x auto-syncs on `run`; the fleet
      # pins 1.7.10, and this step is correct for both.)
      - name: Sync lefthook remote configs
        shell: bash
        env:
          LEFTHOOK_BIN: ${{ inputs.lefthook-bin }}
        run: |
          set -euo pipefail
          LEFTHOOK="${LEFTHOOK_BIN}" "${LEFTHOOK_BIN}" install

          # A fetch failure is silent — lefthook reports no error and later `run`
          # calls just skip every remote command. Fail loudly instead: if this repo
          # declares remotes, the cache must exist once install has run.
          if grep -qE '^[[:space:]]*remotes:' lefthook.yml 2>/dev/null; then
            cache="$(git rev-parse --git-path info/lefthook-remotes)"
            if [[ ! -d "$cache" ]]; then
              echo "::error::lefthook.yml declares 'remotes:' but ${cache} was not created." >&2
              echo "Remote hook commands would be skipped and this job would pass without running them." >&2
              exit 1
            fi
            echo "remote config cache present: ${cache}"
          fi

      - name: Run pre-commit hooks
        if: inputs.run-pre-commit
        shell: bash
        env:
          LEFTHOOK_BIN: ${{ inputs.lefthook-bin }}
        run: |
          set -euo pipefail
          LEFTHOOK="${LEFTHOOK_BIN}" "${LEFTHOOK_BIN}" run pre-commit

      - name: Run commit-msg hook
        if: inputs.run-commit-msg
        shell: bash
        env:
          LEFTHOOK_BIN: ${{ inputs.lefthook-bin }}
          COMMIT_MSG_TEXT: ${{ inputs.commit-msg-text }}
        run: |
          set -euo pipefail
          msg_file="$(mktemp)"
          echo "${COMMIT_MSG_TEXT}" > "${msg_file}"
          LEFTHOOK="${LEFTHOOK_BIN}" "${LEFTHOOK_BIN}" run commit-msg -- "${msg_file}"

      - name: Run pre-push hooks
        if: inputs.run-pre-push
        shell: bash
        env:
          LEFTHOOK_BIN: ${{ inputs.lefthook-bin }}
        run: |
          set -euo pipefail
          LEFTHOOK="${LEFTHOOK_BIN}" "${LEFTHOOK_BIN}" run pre-push
