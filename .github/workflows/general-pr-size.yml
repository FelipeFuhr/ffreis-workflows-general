name: General / PR Size

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Optional PR number (only needed if not running on pull_request)"
        required: false
        type: number
        default: 0
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 10
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

jobs:
  pr-size:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Apply PR size labels
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import subprocess
          from fnmatch import fnmatch

          pr_number = int(os.environ.get("PR_NUMBER", "0") or "0")
          event_pr = os.environ.get("EVENT_PR_NUMBER", "")
          if pr_number == 0 and event_pr:
              pr_number = int(event_pr)

          if pr_number == 0:
              print("::notice::No PR number detected; skipping PR size labeling.")
              sys.exit(0)

          # Exclude generated/lock files when counting diff
          exclude_patterns = [
              "*.sum",        # go.sum
              "uv.lock",      # uv lock file
              "*.lock",       # various lock files
              "pnpm-lock.yaml",
              "yarn.lock",
              "package-lock.json",
          ]

          repo = os.environ.get("GH_REPO", "")
          try:
              cmd = ["gh", "pr", "diff", str(pr_number)]
              if repo:
                  cmd += ["--repo", repo]
              result = subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True,
                  check=True,
              )
              diff_text = result.stdout
          except Exception as e:
              print(f"::error::Failed to fetch PR diff: {e}")
              if getattr(e, "stderr", None):
                  print(e.stderr)
              sys.exit(1)

          # Count lines changed (+ and -), excluding generated/lock files
          added = 0
          removed = 0
          current_file = ""
          skip_file = False
          for line in diff_text.splitlines():
              if line.startswith("diff --git "):
                  parts = line.split()
                  if len(parts) >= 4:
                      current_file = parts[3][2:] if parts[3].startswith("b/") else parts[3]
                      skip_file = any(fnmatch(current_file, p) for p in exclude_patterns)
                  continue
              if skip_file:
                  continue
              if line.startswith("+") and not line.startswith("+++"):
                  added += 1
              elif line.startswith("-") and not line.startswith("---"):
                  removed += 1
          total_changed = added + removed

          # Determine size label
          if total_changed < 10:
              size_label = "size/xs"
          elif total_changed < 50:
              size_label = "size/s"
          elif total_changed < 200:
              size_label = "size/m"
          elif total_changed < 500:
              size_label = "size/l"
          else:
              size_label = "size/xl"

          print(f"PR #{pr_number}: {added} added, {removed} removed, {total_changed} total -> {size_label}")

          # Ensure the size/* label exists before applying it. Consumer repos
          # don't seed size/* labels by default, which previously made this
          # step fail hard ("could not add label") on every first-time PR.
          # --force makes creation idempotent (updates color/description if
          # the label already exists rather than erroring).
          size_colors = {
              "size/xs": "0e8a16",
              "size/s": "5ea603",
              "size/m": "fbca04",
              "size/l": "e07800",
              "size/xl": "d93f0b",
          }
          create_result = subprocess.run(
              [
                  "gh", "label", "create", size_label,
                  "--color", size_colors[size_label],
                  "--description", "PR size (lines changed, excluding lockfiles)",
                  "--force",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          if create_result.returncode != 0:
              print(f"::warning::Could not ensure label {size_label} exists: {create_result.stderr.strip()}")

          # Apply label — non-fatal: a labeling failure must never fail the
          # PR-size check itself.
          apply_result = subprocess.run(
              ["gh", "pr", "edit", str(pr_number), "--add-label", size_label],
              capture_output=True,
              text=True,
              check=False,
          )
          if apply_result.returncode == 0:
              print(f"Applied label: {size_label}")
          else:
              print(f"::warning::Failed to apply label {size_label}: {apply_result.stderr.strip()}")
          PY
