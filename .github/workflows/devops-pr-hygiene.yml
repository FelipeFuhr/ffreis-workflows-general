name: DevOps / PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semantic-pr:
    timeout-minutes: 15
    permissions:
      contents: read
    uses: ./.github/workflows/general-semantic-pr.yml
    with:
      require-scope: false

  commit-messages:
    timeout-minutes: 15
    permissions:
      contents: read
    uses: ./.github/workflows/general-commit-messages.yml
    with:
      require-scope: false

  pr-summary:
    timeout-minutes: 15
    if: github.event.action == 'opened'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/general-pr-summary.yml

  actionlint:
    timeout-minutes: 15
    permissions:
      contents: read
    uses: ./.github/workflows/general-actionlint.yml
    with:
      working-directory: "."
