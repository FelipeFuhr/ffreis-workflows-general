name: DevOps / PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  semantic-pr:
    permissions:
      contents: read
    uses: ./.github/workflows/general-semantic-pr.yml
    with:
      require-scope: false
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  commit-messages:
    permissions:
      contents: read
    uses: ./.github/workflows/general-commit-messages.yml
    with:
      require-scope: false
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  pr-summary:
    if: github.event.action == 'opened'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/general-pr-summary.yml
    with:
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'

  actionlint:
    permissions:
      contents: read
    uses: ./.github/workflows/general-actionlint.yml
    with:
      working-directory: "."
      # This repo is public — self-hosted runners can't serve it (org-scoped pool
      # has no visibility into personal-account repos; GitHub also blocks
      # self-hosted on public repos by default). Must stay hosted.
      runner: '["ubuntu-latest"]'
