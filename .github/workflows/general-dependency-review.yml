name: General / Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: "Minimum severity to fail on (low/moderate/high/critical)"
        required: false
        type: string
        default: "moderate"
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local] (this fleet's runners). Pass '["ubuntu-latest"]' to opt back into GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

jobs:
  dependency-review:
    # actions/dependency-review-action requires GitHub Advanced Security, which
    # is free on public repos but a paid per-committer entitlement on private
    # repos. Skip cleanly on private (never fail for lack of a paid plan);
    # still runs on public.
    if: |
      github.event.repository.visibility == 'public' && (
        inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false
      )
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1541a4984c76d921601d7c # v4.3.4
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
