name: General / Markdownlint

on:
  workflow_call:
    inputs:
      globs:
        description: "Glob pattern(s) for files to lint (space or newline-separated)"
        required: false
        type: string
        default: "**/*.md"
      config:
        description: "Optional path to .markdownlint.yaml config (relative to repo root)"
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 10
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
          Self-hosted homelab box (private repos only): '["self-hosted","local"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  markdownlint:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install markdownlint-cli2
        shell: bash
        run: |
          set -euo pipefail
          npm install -g markdownlint-cli2@0.15.0
          markdownlint-cli2 --version

      - name: Run markdownlint
        env:
          GLOBS: ${{ inputs.globs }}
          CONFIG: ${{ inputs.config }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CONFIG" ]]; then
            args+=("--config" "$CONFIG")
          fi
          # shellcheck disable=SC2086
          markdownlint-cli2 "${args[@]}" $GLOBS
