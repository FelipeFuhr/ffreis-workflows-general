name: General / Markdownlint

on:
  workflow_call:
    inputs:
      globs:
        description: "Glob pattern(s) for files to lint (space or newline-separated)"
        required: false
        type: string
        default: "**/*.md"
      config:
        description: "Optional path to .markdownlint.yaml config (relative to repo root)"
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 10
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

jobs:
  markdownlint:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify markdownlint-cli2
        shell: bash
        run: |
          set -euo pipefail
          # npx --yes runs markdownlint-cli2 from the npm cache instead of
          # `npm install -g`, which fails EACCES on the self-hosted runner
          # (non-root user, /usr/local not writable). Works identically on
          # hosted and self-hosted runners.
          npx --yes markdownlint-cli2@0.23.1 --version

      - name: Run markdownlint
        env:
          GLOBS: ${{ inputs.globs }}
          CONFIG: ${{ inputs.config }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CONFIG" ]]; then
            args+=("--config" "$CONFIG")
          fi
          # scan-fix(ci:globstar): split GLOBS into an array with `read` and pass
          # each element quoted, instead of unquoted `$GLOBS` — bash was
          # pathname-expanding "**/*.md" itself (this shell never sets
          # `shopt -s globstar`), which degrades `**` to a single directory
          # level and silently skipped nested dirs such as docs/adr/**.
          # Confirmed live: a job on a private consumer repo logged
          # "Finding: docs/dependency-caching.md docs/hardware.md" — only the
          # 2 top-level docs/*.md files, while the repo has 30+ markdown files.
          # markdownlint-cli2 uses globby internally and expands `**` (and
          # `#dir` negation) patterns itself correctly when it receives the raw
          # pattern string unexpanded — so quote and let it, per the tool's own
          # docs: "quoting arguments is recommended" to avoid shell expansion.
          glob_args=()
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            read -ra words <<< "$line"
            glob_args+=("${words[@]}")
          done <<< "$GLOBS"
          npx --yes markdownlint-cli2@0.23.1 "${args[@]}" "${glob_args[@]}"
