name: General / CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
  workflow_call:
    inputs:
      languages:
        description: Comma-separated CodeQL languages (e.g. "go,python" or "javascript")
        required: true
        type: string
      source-root:
        description: Source root to analyze
        required: false
        type: string
        default: .
      build-command:
        description: Optional build command. If empty, uses CodeQL autobuild.
        required: false
        type: string
        default: ""
      query-suite:
        description: Optional CodeQL query suite (e.g. security-extended)
        required: false
        type: string
        default: ""
      upload-sarif:
        description: Upload SARIF to GitHub code scanning
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 60
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false

concurrency:
  # Distinct group (literal "codeql" infix) so this never matches a caller's
  # ${{ github.workflow }}-${{ github.ref }} group. When invoked via
  # workflow_call, github.workflow resolves to the CALLER's name, so an
  # identical group would deadlock the run.
  group: ${{ github.workflow }}-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes || 15 }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve CodeQL settings
        id: vars
        env:
          LANGUAGES: ${{ inputs.languages }}
          SOURCE_ROOT: ${{ inputs.source-root }}
          QUERY_SUITE: ${{ inputs.query-suite }}
        run: |
          set -euo pipefail

          resolved_source_root="$SOURCE_ROOT"
          resolved_languages="$(echo "$LANGUAGES" | tr -d ' ')"

          # For `language: actions`, CodeQL expects to find workflows under `.github/workflows/`
          # relative to the repo root. Using `source-root: .github/workflows` can result in
          # "no source code seen during build" because the extractor no longer sees the
          # standard workflow path.
          if [[ "$resolved_languages" == "actions" ]]; then
            resolved_source_root="."
          fi

          {
            echo "languages=$resolved_languages"
            echo "source_root=$resolved_source_root"
            echo "query_suite=$QUERY_SUITE"
          } >> "$GITHUB_OUTPUT"

      - name: CodeQL init (default queries)
        if: inputs.query-suite == ''
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: ${{ steps.vars.outputs.languages }}
          source-root: ${{ steps.vars.outputs.source_root }}

      - name: CodeQL init (custom queries)
        if: inputs.query-suite != ''
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: ${{ steps.vars.outputs.languages }}
          source-root: ${{ steps.vars.outputs.source_root }}
          queries: ${{ steps.vars.outputs.query_suite }}

      - name: Autobuild
        if: inputs.build-command == '' && steps.vars.outputs.languages != 'actions'
        uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

      - name: Build (manual)
        if: inputs.build-command != ''
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          bash -lc "$BUILD_COMMAND"

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: "/language:${{ steps.vars.outputs.languages }}"
          upload: ${{ inputs.upload-sarif && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
