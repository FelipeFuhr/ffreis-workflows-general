name: General / Workflows Policy

on:
  workflow_call:
    inputs:
      workflows-glob:
        description: Glob for workflow files (relative to repo root)
        required: false
        type: string
        default: ".github/workflows/*.yml"
      allowed-unpinned-actions:
        description: JSON array of action refs allowed to use a tag instead of a full SHA (temporary allowlist)
        required: false
        type: string
        default: |-
          [
            "actions/download-artifact@v4",
            "actions/github-script@v6",
            "aquasecurity/tfsec-action@v1.0.3",
            "aws-actions/configure-aws-credentials@v4",
            "google/osv-scanner-action@v1",
            "googleapis/release-please-action@v4",
            "golang/govulncheck-action@v1",
            "infracost/actions/setup@v3",
            "ossf/scorecard-action@v2",
            "semgrep/semgrep-action@v1",
            "terraform-linters/setup-tflint@v4"
          ]
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      draft-gate-exempt:
        description: Extra comma-separated workflow names/stems exempt from draft-gating (always-run)
        required: false
        type: string
        default: ""
      runner:
        description: |
          JSON-encoded runner label(s). Default: self-hosted [self-hosted, local] (this fleet's runners). Pass '["ubuntu-latest"]' to opt back into GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

permissions: {}

jobs:
  policy:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Policy
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Draft-gating policy
        env:
          DRAFT_GATE_EXEMPT: ${{ inputs.draft-gate-exempt }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --only-binary :all: "pyyaml==6.0.2" >/dev/null 2>&1 || true
          python3 - <<'PY'
          # Mirror of quality-kit/scripts/ci_draft_policy.py — keep the rule in sync.
          import glob, os, sys
          try:
              import yaml
          except ImportError:
              print("::warning::pyyaml unavailable; skipping draft-gating policy"); sys.exit(0)
          EXEMPT = set("release release-please scorecard stale labeler dependabot dependency-review scheduled drift drift-detect codeql".split())
          EXEMPT |= {x.strip().lower() for x in os.environ.get("DRAFT_GATE_EXEMPT", "").split(",") if x.strip()}
          GATE = ("draft", "run_on_draft", "github.event_name", "github.ref")
          viol = []
          for f in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")):
              try:
                  d = yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  viol.append(f"{f}: parse error {e}"); continue
              if not isinstance(d, dict):
                  continue
              stem = os.path.splitext(os.path.basename(f))[0].lower(); nm = str(d.get("name", "")).lower()
              if stem in EXEMPT or nm in EXEMPT:
                  continue
              on = d.get("on", d.get(True)); pr = None; has = False
              if isinstance(on, dict):
                  has = "pull_request" in on or "pull_request_target" in on
                  pr = on.get("pull_request", on.get("pull_request_target"))
              elif isinstance(on, list):
                  has = "pull_request" in on
              elif isinstance(on, str):
                  has = on == "pull_request"
              if not has:
                  continue
              types = pr.get("types", []) if isinstance(pr, dict) else []
              if "ready_for_review" not in (types or []):
                  viol.append(f"{f}: pull_request trigger must include ready_for_review")
              for jid, job in (d.get("jobs", {}) or {}).items():
                  if not isinstance(job, dict):
                      continue
                  if str(job.get("uses", "")).strip() or "needs" in job:
                      continue
                  if not any(t in str(job.get("if", "")) for t in GATE):
                      viol.append(f"{f}: job '{jid}' is not draft-gated")
              conc = d.get("concurrency"); cip = str(conc.get("cancel-in-progress", "")).lower() if isinstance(conc, dict) else ""
              if "true" not in cip and "pull_request" not in cip:
                  viol.append(f"{f}: missing concurrency.cancel-in-progress: true")
          for v in viol:
              print("::error::[draft-gate] " + v)
          print(f"draft-gating policy: {len(viol)} violation(s)")
          sys.exit(1 if viol else 0)
          PY

      - name: Validate workflows policy
        env:
          WORKFLOWS_GLOB: ${{ inputs.workflows-glob }}
          ALLOWED_UNPINNED_ACTIONS: ${{ inputs.allowed-unpinned-actions }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import re
          import sys

          workflows_glob = os.environ.get("WORKFLOWS_GLOB", ".github/workflows/*.yml")
          allow_json = os.environ.get("ALLOWED_UNPINNED_ACTIONS", "[]")

          try:
              allowed_unpinned = set(json.loads(allow_json))
          except Exception as e:
              print(f"ERROR: inputs.allowed-unpinned-actions must be valid JSON array: {e}", file=sys.stderr)
              sys.exit(2)

          uses_re = re.compile(r"^\\s*uses:\\s*([^\\s#]+)")
          secrets_inherit_re = re.compile(r"^\\s*secrets:\\s*inherit\\s*$")

          # run: | / run: > block detection
          block_run_start_re = re.compile(r"^\\s*run:\\s*([>|][+-]?)\\s*$")
          inline_run_re = re.compile(r"^\\s*run:\\s*(.+?)\\s*$")

          branch_ref_re = re.compile(r"^(main|master|HEAD|refs/heads/.+)$")
          sha_re = re.compile(r"^[0-9a-f]{40}$")

          errors: list[tuple[str, int, str, str]] = []
          warnings: list[tuple[str, int, str, str]] = []


          def add_err(path: str, lineno: int, msg: str, line: str = "") -> None:
              errors.append((path, lineno, msg, line))


          def add_warn(path: str, lineno: int, msg: str, line: str = "") -> None:
              warnings.append((path, lineno, msg, line))


          def iter_workflow_files(pattern: str):
              for p in sorted(glob.glob(pattern, recursive=True)):
                  if os.path.isdir(p):
                      continue
                  yield p


          def scan_file(path: str) -> None:
              try:
                  lines = open(path, "r", encoding="utf-8", errors="ignore").read().splitlines()
              except FileNotFoundError:
                  return

              # 1) No secrets: inherit
              for i, line in enumerate(lines, start=1):
                  if secrets_inherit_re.match(line):
                      add_err(path, i, "Forbidden: secrets: inherit", line.strip())

              # 2) uses: pinned, no branch refs
              for i, line in enumerate(lines, start=1):
                  m = uses_re.match(line)
                  if not m:
                      continue
                  val = m.group(1).strip().strip("\"'")
                  if val.startswith("./") or val.startswith("docker://"):
                      continue
                  if "@" not in val:
                      add_warn(path, i, "uses: without @ref (cannot verify pinning)", val)
                      continue
                  action, ref = val.rsplit("@", 1)
                  full = f"{action}@{ref}"
                  if branch_ref_re.match(ref):
                      # Self-referential org workflows use @main intentionally to avoid
                      # the bootstrap cycle of pinning to a SHA that doesn't exist yet.
                      if action.startswith("FelipeFuhr/ffreis-workflows-general/.github/workflows/") and ref == "main":
                          continue
                      add_err(path, i, f"Forbidden: branch ref in uses: ({ref})", val)
                      continue
                  if sha_re.match(ref):
                      continue
                  if full in allowed_unpinned:
                      add_warn(path, i, f"Allowed unpinned action ref: {full}", val)
                      continue
                  add_warn(path, i, f"Unpinned action ref (recommend full SHA): {full}", val)

              # 3) No GitHub expression interpolation inside run: scripts
              expr_token = "${" + "{"
              idx = 0
              while idx < len(lines):
                  line = lines[idx]
                  m_block = block_run_start_re.match(line)
                  if m_block:
                      run_indent = len(line) - len(line.lstrip())
                      idx += 1
                      while idx < len(lines):
                          l = lines[idx]
                          if l.strip() and (len(l) - len(l.lstrip())) <= run_indent:
                              break
                          if expr_token in l:
                              add_err(
                                  path,
                                  idx + 1,
                                  "Forbidden: expression token inside run: block (shell injection risk)",
                                  l.strip(),
                              )
                          idx += 1
                      continue

                  m_inline = inline_run_re.match(line)
                  if m_inline:
                      after = m_inline.group(1).strip()
                      if not after.startswith("|") and not after.startswith(">"):
                          if expr_token in after:
                              add_err(path, idx + 1, "Forbidden: expression token inside run: (shell injection risk)", line.strip())
                  idx += 1


          files = list(iter_workflow_files(workflows_glob))
          if not files:
              add_err(workflows_glob, 0, "No workflow files found for workflows-glob", workflows_glob)

          for f in files:
              scan_file(f)

          if warnings:
              print("WARNINGS:")
              for path, lineno, msg, line in warnings:
                  loc = f"{path}:{lineno}" if lineno else path
                  print(f"- {loc}: {msg} :: {line}")

          if errors:
              print("ERRORS:", file=sys.stderr)
              for path, lineno, msg, line in errors:
                  loc = f"{path}:{lineno}" if lineno else path
                  print(f"- {loc}: {msg} :: {line}", file=sys.stderr)
              sys.exit(1)

          print("OK: workflows policy checks passed.")
          PY
