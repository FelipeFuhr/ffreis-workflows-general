name: General / OSSF Scorecard

# SCAN-ONLY (+ optional SARIF upload). Does NOT publish and does NOT require id-token,
# so any caller can use it without granting id-token:write. To publish to the OpenSSF
# REST API (badge), call general-scorecard-publish.yml instead (it requires id-token).
#
# Runs the `scorecard` CLI binary directly rather than `ossf/scorecard-action`: that
# action is a Docker container action (`runs: using: docker`), and the self-hosted k3s
# runner pods have no usable Docker daemon, so every scan on the default `self-hosted`
# runner failed with "Docker pull failed" (fleet-wide, pre-existing). The CLI is the
# same analysis engine the action wraps for scan-only mode (no signing/publishing
# involved here), so this produces equivalent SARIF with no container runtime anywhere.

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: Upload SARIF to GitHub code scanning
        required: false
        type: boolean
        default: false
      publish-results:
        description: >-
          Deprecated compatibility input. This scan-only workflow never publishes;
          call general-scorecard-publish.yml when OpenSSF publishing is required.
        required: false
        type: boolean
        default: false
      scorecard-version:
        description: scorecard CLI version to install (without leading v)
        required: false
        type: string
        default: "5.5.0"
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
      runner:
        description: |
          JSON-encoded runner label. Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

    secrets:
      SCORECARD_TOKEN:
        description: >-
          Optional read-only PAT used as scorecard's GITHUB_AUTH_TOKEN.
          REQUIRED FOR PRIVATE REPOSITORIES. scorecard reads commit history
          through the GraphQL API, and the default GITHUB_TOKEN cannot do that
          on a private repo -- the scan aborts with
          "ListCommits: githubv4.Query: Resource not accessible by integration"
          and produces no SARIF. A fine-grained token with Contents:R,
          Metadata:R, PRs:R and Actions:R is sufficient; the fleet's
          FLEET_READ_TOKEN already carries exactly that.
          Public repositories need nothing -- github.token suffices.
        required: false

permissions: {}

jobs:
  scorecard:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: OSSF Scorecard
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install scorecard
        env:
          SCORECARD_VERSION: ${{ inputs.scorecard-version || '5.5.0' }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          archive="scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}"
          curl -fsSL "${base}/${archive}" -o "$tmp/${archive}"
          curl -fsSL "${base}/scorecard_checksums.txt" -o "$tmp/checksums.txt"
          (cd "$tmp" && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/${archive}" -C "$tmp" scorecard
          sudo install -m 0755 "$tmp/scorecard" /usr/local/bin/scorecard
          scorecard version

      - name: Write scorecard policy
        # SARIF output maps each check's score to a SARIF severity level via a policy
        # file; without one, formatting fails outright for some checks (observed:
        # "internal error: missing policy for check: Binary-Artifacts"). This is the
        # same default policy ossf/scorecard-action bakes into its container image
        # (policies/template.yml) for scan-only (non-publish) mode.
        run: |
          cat > "${GITHUB_WORKSPACE}/.scorecard-policy.yml" <<'EOF'
          version: 1
          policies:
            Token-Permissions:
                score: 10
                mode: enforced
            Branch-Protection:
                score: 10
                mode: enforced
            Code-Review:
                score: 10
                mode: enforced
            Dangerous-Workflow:
                score: 10
                mode: enforced
            License:
                score: 9
                mode: enforced
            Pinned-Dependencies:
                score: 10
                mode: enforced
            Security-Policy:
                score: 10
                mode: enforced
            SAST:
                score: 10
                mode: enforced
            Contributors:
                score: 10
                mode: disabled
            Packaging:
                score: 10
                mode: enforced
            Binary-Artifacts:
                score: 10
                mode: enforced
            Signed-Releases:
                score: 10
                mode: disabled
            Dependency-Update-Tool:
                score: 10
                mode: enforced
            Fuzzing:
                score: 10
                mode: enforced
            CII-Best-Practices:
                # passing score
                score: 5
                mode: enforced
            Vulnerabilities:
                score: 10
                mode: enforced
            CI-Tests:
                score: 10
                mode: enforced
            Maintained:
                score: 1
                mode: enforced
          EOF

      - name: Run OSSF Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.SCORECARD_TOKEN || github.token }}
          SCORECARD_REPO: ${{ github.repository }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          HAVE_SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN != '' }}
          # SARIF is a feature-flagged format in the scorecard library, gated behind
          # this env var rather than exposed as a plain CLI flag (ossf/scorecard-action
          # sets the same var internally before calling the same library function).
          ENABLE_SARIF: "1"
        run: |
          set -euo pipefail

          # Keep stderr: scorecard reports a fatal scan abort there while still
          # exiting 0, so the message is the only way to tell WHY the SARIF is
          # empty. Without this the private-repo token failure below is
          # indistinguishable from a formatting bug.
          set +e
          scorecard --repo="${SCORECARD_REPO}" --format=sarif --show-details \
            --policy="${GITHUB_WORKSPACE}/.scorecard-policy.yml" \
            > scorecard.sarif 2> scorecard.stderr
          rc=$?
          set -e
          cat scorecard.stderr >&2 || true

          # scorecard has logged-but-non-fatal formatting failures (exit 0 with an
          # empty/truncated file) — verify the output is non-empty, valid JSON before
          # letting a broken SARIF file reach the upload step.
          if [[ "$rc" -ne 0 ]] || [[ ! -s scorecard.sarif ]] \
             || ! python3 -c 'import json,sys; json.load(open("scorecard.sarif"))'; then
            # The overwhelmingly common cause on this fleet: a private repo with no
            # SCORECARD_TOKEN. scorecard reads commit history over GraphQL, which the
            # default GITHUB_TOKEN cannot do on a private repo. It surfaces as
            # "Resource not accessible by integration", which reads like a workflow
            # permissions bug and has repeatedly been diagnosed as one — it is not;
            # no `permissions:` block can grant it.
            if grep -q "Resource not accessible by integration" scorecard.stderr 2>/dev/null \
               && [[ "${REPO_VISIBILITY}" == "private" ]] \
               && [[ "${HAVE_SCORECARD_TOKEN}" != "true" ]]; then
              echo "::error title=Scorecard needs a token on private repos::\
          ${SCORECARD_REPO} is private and no SCORECARD_TOKEN was passed. scorecard \
          reads commit history through the GraphQL API and the default GITHUB_TOKEN \
          cannot do that on a private repository. Pass a read-only PAT, e.g. \
          pass FLEET_READ_TOKEN through as SCORECARD_TOKEN in the caller's \
          'secrets:' block -- it already carries Contents:R, Metadata:R, \
          PRs:R and Actions:R. Alternatively set the SCORECARD_ENABLED repo \
          variable to false. This is NOT a workflow 'permissions:' problem."
              exit 1
            fi
            echo "ERROR: scorecard produced no valid SARIF output." >&2
            cat scorecard.sarif >&2 || true
            exit 1
          fi

      - name: Upload SARIF
        if: inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
