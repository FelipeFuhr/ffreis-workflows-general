name: General / Security Filesystem Bundle

# Consolidated filesystem-security scan. Runs Trivy (fs), Grype (fs) and gitleaks
# as sequential STEPS in ONE job sharing a single checkout, instead of three
# separate caller jobs. GitHub bills every job rounded up to a whole minute, so
# collapsing 3 jobs -> 1 cuts ~2 billed minutes per call with no loss of coverage:
# every scanner still runs and every finding is still reported. Each scanner
# captures its own exit code; the job fails at the end only when fail-on-vuln is
# set and at least one scanner found something at/above its severity threshold.
#
# OSV-Scanner is intentionally NOT folded in: general-osv-scanner.yml is a
# reusable-workflow `uses:` of google/osv-scanner-action (Renovate-managed) and
# cannot run as a step. It stays a standalone job.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan
        required: false
        type: string
        default: "."
      severity:
        description: "Minimum severity that fails when fail-on-vuln=true (low/medium/high/critical)"
        required: false
        type: string
        default: "high"
      fail-on-vuln:
        description: Fail the job when vulnerabilities are found at/above severity
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: Upload SARIF to GitHub code scanning
        required: false
        type: boolean
        default: false
      scan-history:
        description: Scan full git history for secrets (gitleaks; requires fetch-depth 0)
        required: false
        type: boolean
        default: false
      gitleaks-version:
        description: gitleaks version to install (without leading v)
        required: false
        type: string
        default: "8.30.1"
      gitleaks-config-path:
        description: Optional gitleaks config path (relative to repo root)
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Maximum number of minutes before the job is cancelled
        required: false
        type: number
        default: 20
      runner:
        description: |
          JSON-encoded runner label. Default: GitHub-hosted ubuntu-latest.
          For scheduled cron jobs on AWS Spot: '["self-hosted","spot","linux","x64"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  security-fs:
    name: Security (fs bundle)
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ inputs.scan-history && 0 || 1 }}

      # --- Trivy (filesystem) ------------------------------------------------
      - name: Run Trivy (filesystem)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          exit-code: ${{ inputs.fail-on-vuln && 1 || 0 }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif

      - name: Validate Trivy SARIF
        shell: bash
        run: |
          set -euo pipefail
          test -s trivy.sarif || { echo "::error::trivy.sarif was not generated or is empty"; exit 1; }

      # --- Grype (filesystem) ------------------------------------------------
      - name: Install Grype
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="dee8de483dfba5b4e0bc0aa8e4ab2ce52137e490"
          SCRIPT_URL="https://raw.githubusercontent.com/anchore/grype/${PINNED_COMMIT}/install.sh"
          _grype_tmp="$(mktemp -d)"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            "$SCRIPT_URL" -o /tmp/grype-install.sh
          grep -q "grype" /tmp/grype-install.sh
          sh /tmp/grype-install.sh -b "$_grype_tmp" v0.114.0
          sudo install -m 0755 "$_grype_tmp/grype" /usr/local/bin/grype
          grype version

      - name: Run Grype (filesystem)
        id: grype
        env:
          SCAN_PATH: ${{ inputs.working-directory }}
          SEVERITY: ${{ inputs.severity }}
        shell: bash
        run: |
          set -uo pipefail
          attempt=0
          max_attempts=3
          exit_code=0
          while true; do
            attempt=$((attempt + 1))
            grype "dir:${SCAN_PATH}" \
              --fail-on "$SEVERITY" \
              -o sarif \
              > grype.sarif 2> grype.stderr.log
            exit_code="$?"
            if test -s grype.sarif; then
              break
            fi
            # An empty SARIF almost always means a transient DB/network failure —
            # grype writes a valid SARIF with empty results when it finds nothing,
            # so a truly clean scan is never empty. Retry with backoff.
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::grype.sarif still empty after ${max_attempts} attempts (transient DB/network?)"
              if test -s grype.stderr.log; then
                echo "::group::grype stderr (tail)"
                tail -n 200 grype.stderr.log || true
                echo "::endgroup::"
              fi
              exit 1
            fi
            echo "::warning::grype produced an empty SARIF (attempt ${attempt}/${max_attempts}); retrying after backoff"
            sleep "$((attempt * 10))"
          done
          echo "exit-code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::Grype found vulnerabilities (exit=${exit_code}) at/above ${SEVERITY}."
          fi

      # --- gitleaks ----------------------------------------------------------
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "$url" -o "$tmp/gitleaks.tgz"
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          CONFIG_PATH: ${{ inputs.gitleaks-config-path }}
          SCAN_HISTORY: ${{ inputs.scan-history }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [[ -z "$CONFIG_PATH" && -f ".gitleaks.toml" ]]; then
            if grep -qF '[[allowlist]]' .gitleaks.toml; then
              echo "::error::.gitleaks.toml uses legacy '[[allowlist]]' (array) format; expected a single '[allowlist]' table."
              exit 2
            fi
          fi
          args=(detect --no-banner --redact --source . --report-format sarif --report-path "${GITHUB_WORKSPACE}/gitleaks.sarif")
          [[ "$SCAN_HISTORY" != "true" ]] && args+=(--no-git)
          [[ -n "$CONFIG_PATH" ]] && args+=(--config "${GITHUB_WORKSPACE}/${CONFIG_PATH}")
          gitleaks "${args[@]}"

      # --- SARIF uploads (one category each, fork-gated) ---------------------
      - name: Upload Trivy SARIF
        if: inputs.upload-sarif && hashFiles('trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

      - name: Upload Grype SARIF
        if: inputs.upload-sarif && hashFiles('grype.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: grype.sarif
          category: grype-fs

      - name: Upload gitleaks SARIF
        if: inputs.upload-sarif && hashFiles('gitleaks.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      # --- Aggregate verdict (single fail point) -----------------------------
      - name: Evaluate scanner results
        env:
          FAIL_ON_VULN: ${{ inputs.fail-on-vuln }}
          SEVERITY: ${{ inputs.severity }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          GRYPE_EXIT: ${{ steps.grype.outputs.exit-code }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # gitleaks: any non-success outcome means secrets found (or a real error) -> always fail.
          if [[ "$GITLEAKS_OUTCOME" != "success" ]]; then
            echo "::error::gitleaks reported findings or errored."
            fail=1
          fi
          if [[ "$FAIL_ON_VULN" == "true" ]]; then
            [[ "$TRIVY_OUTCOME" != "success" ]] && { echo "::error::Trivy found vulnerabilities at/above HIGH."; fail=1; }
            [[ "${GRYPE_EXIT:-0}" -ne 0 ]] && { echo "::error::Grype found vulnerabilities at/above ${SEVERITY}."; fail=1; }
          fi
          exit "$fail"
