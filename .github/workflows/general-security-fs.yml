name: General / Security Filesystem Bundle

# Consolidated filesystem-security scan. Runs Trivy (fs), Grype (fs) and gitleaks
# as sequential STEPS in ONE job sharing a single checkout, instead of three
# separate caller jobs. GitHub bills every job rounded up to a whole minute, so
# collapsing 3 jobs -> 1 cuts ~2 billed minutes per call with no loss of coverage:
# every scanner still runs and every finding is still reported. Each scanner
# captures its own exit code; the job fails at the end only when fail-on-vuln is
# set and at least one scanner found something at/above its severity threshold.
#
# OSV-Scanner is intentionally NOT folded in: general-osv-scanner.yml carries its
# own `concurrency:` group and its own draft gate, neither of which survives being
# flattened into a step here. It stays a standalone job.
#
# (It no longer `uses:` google/osv-scanner-action — that reusable tag-pinned
# actions/download-artifact internally, which every repo with
# sha_pinning_required rejects at "Set up job" with zero steps. It now downloads
# the osv-scanner binary directly. Callers still pinned to a pre-fix ref see that
# startup failure and need a pin bump, not a workflow change.)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to scan
        required: false
        type: string
        default: "."
      severity:
        description: "Minimum severity that fails when fail-on-vuln=true (low/medium/high/critical)"
        required: false
        type: string
        default: "high"
      fail-on-vuln:
        description: Fail the job when vulnerabilities are found at/above severity
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: Upload SARIF to GitHub code scanning
        required: false
        type: boolean
        default: false
      scan-history:
        description: Scan full git history for secrets (gitleaks; requires fetch-depth 0)
        required: false
        type: boolean
        default: false
      gitleaks-version:
        description: gitleaks version to install (without leading v)
        required: false
        type: string
        default: "8.30.1"
      gitleaks-config-path:
        description: Optional gitleaks config path (relative to repo root)
        required: false
        type: string
        default: ""
      timeout-minutes:
        description: Maximum number of minutes before the job is cancelled
        required: false
        type: number
        default: 20
      runner:
        description: |
          JSON-encoded runner label. Default: self-hosted [self-hosted, local]. Pass '["ubuntu-latest"]' for GitHub-hosted.
        required: false
        type: string
        default: '["self-hosted","local"]'

permissions: {}

jobs:
  security-fs:
    name: Security (fs bundle)
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: runner.environment == 'github-hosted'
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: ${{ inputs.scan-history && 0 || 1 }}

      # --- Trivy (filesystem) ------------------------------------------------
      - name: Run Trivy (filesystem)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          exit-code: ${{ inputs.fail-on-vuln && 1 || 0 }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif

      - name: Validate Trivy SARIF
        shell: bash
        run: |
          set -euo pipefail
          test -s trivy.sarif || { echo "::error::trivy.sarif was not generated or is empty"; exit 1; }

      # --- Grype (filesystem) ------------------------------------------------
      - name: Install Grype
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="dee8de483dfba5b4e0bc0aa8e4ab2ce52137e490"
          SCRIPT_URL="https://raw.githubusercontent.com/anchore/grype/${PINNED_COMMIT}/install.sh"
          _grype_tmp="$(mktemp -d)"
          curl --fail --show-error --silent --location \
            --proto '=https' --proto-redir '=https' \
            "$SCRIPT_URL" -o /tmp/grype-install.sh
          grep -q "grype" /tmp/grype-install.sh
          sh /tmp/grype-install.sh -b "$_grype_tmp" v0.114.0
          sudo install -m 0755 "$_grype_tmp/grype" /usr/local/bin/grype
          grype version

      - name: Run Grype (filesystem)
        id: grype
        env:
          SCAN_PATH: ${{ inputs.working-directory }}
          SEVERITY: ${{ inputs.severity }}
        shell: bash
        run: |
          set -uo pipefail
          # grype's exit-code/output contract, probed against the pinned v0.114.0
          # binary and locked by scripts/test-grype-scan-verdict.sh:
          #
          #   exit 0,     SARIF written -> scan ran; nothing at/above --fail-on
          #   exit 2,     SARIF written -> scan ran; findings at/above --fail-on
          #   exit 1,     SARIF EMPTY   -> grype never completed (bad config, a
          #                                path it cannot resolve, DB failure);
          #                                stderr carries an `ERROR ...` line
          #   exit >= 128, SARIF EMPTY  -> grype was killed by signal exit-128
          #
          # A repo with no package manifests is the FIRST case, not an error:
          # grype writes a valid 358-byte SARIF with an empty `results` array and
          # exits 0. "Nothing to scan" is therefore a pass that must be stated,
          # and nothing here is retryable — every empty-SARIF cause above is
          # deterministic or fatal. The previous 3-attempt backoff loop could not
          # fix any of them; it only kept a dying job on the runner longer, which
          # is what turned a diagnosable failure into "received a shutdown
          # signal". The kill case is why the loop looked plausible: the OOM
          # killer takes grype (the largest RSS in the pod cgroup) while bash
          # survives, so the step saw an empty file and no error text at all.
          #
          # scan-fix(grype:self-scan): exclude grype's own binary — installed to
          # /usr/local/bin/grype (GHA) or /bin/grype (host/act); without this,
          # CVEs in grype's own Go stdlib/docker deps surface as project findings.
          # grype >= 0.114.0 rejects absolute exclusion paths ("invalid exclusion
          # pattern(s) ... must start with one of: './', '*/', or '**/'") — exclusions
          # are matched relative to the scan root, so a '**/' prefix is required and
          # still matches these binary paths at any depth under the scanned tree.
          #
          # The CycloneDX output answers "did this gate check anything?". A
          # zero-finding SARIF is only trustworthy next to the number of packages
          # cataloged, so both are logged. One scan, two serializers — grype
          # builds the SBOM either way; this only asks it to also write it out.
          sbom_json="$(mktemp -d)/grype-sbom.json"
          # GHA invokes `shell: bash` with -e, so a non-zero grype exit would kill
          # the shell before the code could be captured; && / || keeps it alive.
          grype "dir:${SCAN_PATH}" \
            --exclude '**/bin/grype' \
            --exclude '**/usr/local/bin/grype' \
            --exclude '**/usr/bin/grype' \
            --fail-on "$SEVERITY" \
            -o "sarif=grype.sarif" \
            -o "cyclonedx-json=${sbom_json}" \
            2> grype.stderr.log \
            && exit_code=0 \
            || exit_code=$?

          dump_stderr() {
            if test -s grype.stderr.log; then
              echo "::group::grype stderr (tail)"
              tail -n 200 grype.stderr.log || true
              echo "::endgroup::"
            fi
          }

          if ! test -s grype.sarif; then
            # No report at all: the scan did NOT run, so this can never pass.
            if [[ "$exit_code" -ge 128 ]]; then
              echo "::error::grype was killed by signal $((exit_code - 128)) before writing a report — the scan did not run. On a memory-capped runner this is almost always the OOM killer choosing grype; give this job a larger runner class rather than re-running it."
            else
              reason=""
              if test -s grype.stderr.log; then
                reason="$(grep -m1 'ERROR' grype.stderr.log | tr -d '\r')"
              fi
              echo "::error::grype failed to run (exit ${exit_code}) and wrote no report: ${reason:-<no error text captured>}"
            fi
            dump_stderr
            exit 1
          fi

          census="$(SARIF_PATH=grype.sarif SBOM_PATH="$sbom_json" python3 - <<'PY'
          import json
          import os
          import pathlib

          sarif = json.loads(pathlib.Path(os.environ["SARIF_PATH"]).read_text())
          findings = sum(len(run.get("results") or []) for run in sarif.get("runs") or [])
          sbom = pathlib.Path(os.environ["SBOM_PATH"])
          packages = 0
          if sbom.is_file() and sbom.stat().st_size:
              packages = len(json.loads(sbom.read_text()).get("components") or [])
          print(findings, packages)
          PY
          )" || {
            echo "::error::grype wrote a report that is not valid JSON — treating as a failed scan, not as zero findings."
            dump_stderr
            exit 1
          }
          findings="${census%% *}"
          packages="${census##* }"

          {
            echo "exit-code=${exit_code}"
            echo "findings=${findings}"
            echo "packages=${packages}"
          } >> "$GITHUB_OUTPUT"

          # 0 = clean, 2 = --fail-on threshold met. Anything else alongside a
          # written report is a grype contract change we must not paper over.
          if [[ "$exit_code" -ne 0 && "$exit_code" -ne 2 ]]; then
            echo "::error::grype wrote a report but exited ${exit_code}, which is neither 'clean' (0) nor 'findings' (2)."
            dump_stderr
            exit 1
          fi

          if [[ "$packages" -eq 0 ]]; then
            echo "Grype: no package manifests found under '${SCAN_PATH}' — 0 packages cataloged, so there is nothing to match against. The scan itself completed (exit ${exit_code}); this gate passes."
          else
            echo "Grype: scan completed — ${packages} package(s) cataloged, ${findings} finding(s) at/above ${SEVERITY}."
          fi
          if [[ "$exit_code" -eq 2 ]]; then
            echo "::warning::Grype found vulnerabilities at/above ${SEVERITY} (${findings} finding(s))."
          fi

      # --- gitleaks ----------------------------------------------------------
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "$url" -o "$tmp/gitleaks.tgz"
          tar -xzf "$tmp/gitleaks.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          CONFIG_PATH: ${{ inputs.gitleaks-config-path }}
          SCAN_HISTORY: ${{ inputs.scan-history }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [[ -z "$CONFIG_PATH" && -f ".gitleaks.toml" ]]; then
            # Anchor to line-start to avoid matching comments that reference [[allowlist]] in prose.
            if grep -qE '^[[:space:]]*\[\[allowlist\]\]' .gitleaks.toml; then
              echo "::error::.gitleaks.toml uses legacy '[[allowlist]]' (array) format; expected a single '[allowlist]' table."
              exit 2
            fi
          fi
          args=(detect --no-banner --redact --source . --report-format sarif --report-path "${GITHUB_WORKSPACE}/gitleaks.sarif")
          [[ "$SCAN_HISTORY" != "true" ]] && args+=(--no-git)
          [[ -n "$CONFIG_PATH" ]] && args+=(--config "${GITHUB_WORKSPACE}/${CONFIG_PATH}")
          gitleaks "${args[@]}"

      # --- SARIF uploads (one category each, fork-gated) ---------------------
      - name: Upload Trivy SARIF
        if: inputs.upload-sarif && hashFiles('trivy.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

      - name: Upload Grype SARIF
        if: inputs.upload-sarif && hashFiles('grype.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: grype.sarif
          category: grype-fs

      - name: Upload gitleaks SARIF
        if: inputs.upload-sarif && hashFiles('gitleaks.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      # --- Aggregate verdict (single fail point) -----------------------------
      - name: Evaluate scanner results
        env:
          FAIL_ON_VULN: ${{ inputs.fail-on-vuln }}
          SEVERITY: ${{ inputs.severity }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          GRYPE_EXIT: ${{ steps.grype.outputs.exit-code }}
          GRYPE_FINDINGS: ${{ steps.grype.outputs.findings }}
          GRYPE_PACKAGES: ${{ steps.grype.outputs.packages }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # Say what ran before saying what it found: a clean verdict over zero
          # cataloged packages is a different statement from a clean verdict over
          # a real dependency tree, and only one of them is reassuring.
          echo "Grype: ${GRYPE_PACKAGES:-?} package(s) cataloged, ${GRYPE_FINDINGS:-?} finding(s) at/above ${SEVERITY} (grype exit ${GRYPE_EXIT:-?})."
          # gitleaks: any non-success outcome means secrets found (or a real error) -> always fail.
          if [[ "$GITLEAKS_OUTCOME" != "success" ]]; then
            echo "::error::gitleaks reported findings or errored."
            fail=1
          fi
          if [[ "$FAIL_ON_VULN" == "true" ]]; then
            [[ "$TRIVY_OUTCOME" != "success" ]] && { echo "::error::Trivy found vulnerabilities at/above HIGH."; fail=1; }
            # grype exit 2 (and only 2) means "findings at/above the threshold".
            # Exit 1 is a scanner ERROR and never reaches here — the grype step
            # fails the job itself rather than letting an error masquerade as a
            # vulnerability verdict, which is what `-ne 0` used to do.
            [[ "${GRYPE_EXIT:-0}" -eq 2 ]] && { echo "::error::Grype found ${GRYPE_FINDINGS:-?} vulnerability finding(s) at/above ${SEVERITY}."; fail=1; }
          fi
          exit "$fail"
