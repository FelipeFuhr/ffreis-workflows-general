name: General / pre-commit

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run pre-commit in (repo-relative)
        required: false
        type: string
        default: "."
      pre-commit-version:
        description: pre-commit version to install
        required: false
        type: string
        default: "4.0.1"
      require-config:
        description: Fail if .pre-commit-config.yaml is missing
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run pre-commit
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          PRE_COMMIT_VERSION: ${{ inputs.pre-commit-version }}
          REQUIRE_CONFIG: ${{ inputs.require-config }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"

          if [[ ! -f .pre-commit-config.yaml ]]; then
            if [[ "$REQUIRE_CONFIG" == "true" ]]; then
              echo "ERROR: missing .pre-commit-config.yaml in $WORKING_DIRECTORY"
              exit 1
            fi
            echo "No .pre-commit-config.yaml found in $WORKING_DIRECTORY; skipping."
            exit 0
          fi

          python3 -m pip install --upgrade pip
          python3 -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit --version
          pre-commit run --all-files --show-diff-on-failure
