name: General / Promote Gate

on:
  workflow_call:
    inputs:
      dev_url:
        description: "Base URL of the dev site to verify (e.g. https://dev.ffreis.com)"
        required: true
        type: string
      paths:
        description: "Space-separated URL paths to check (default: /en/ /)"
        required: false
        type: string
        default: "/en/ /"
      timeout-minutes:
        description: "Maximum minutes before the job is cancelled"
        required: false
        type: number
        default: 5
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false

jobs:
  gate:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Verify dev site before promote
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # A PR that only touches .github/ (CI/workflow config) promotes no content,
      # so the dev-site health is irrelevant. Skip the check but still PASS, so the
      # required status check stays satisfied without weakening branch protection.
      - name: Detect CI-only change (nothing to promote)
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename' 2>/dev/null || true)
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^\.github/'; then
            echo "ci_only=true" >> "$GITHUB_OUTPUT"
            echo "All changed files are under .github/ — CI-only change, nothing to promote. Gate passes."
          else
            echo "ci_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check dev site is healthy
        if: steps.scope.outputs.ci_only != 'true'
        env:
          BASE: ${{ inputs.dev_url }}
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          FAILED=()
          for path in $PATHS; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --location "${BASE%/}${path}")
            case "$status" in
              2*|301|302) echo "ok  ${BASE%/}${path} → $status" ;;
              *)
                echo "FAIL ${BASE%/}${path} → $status"
                FAILED+=("${path}")
                ;;
            esac
          done
          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo ""
            echo "Dev site health check failed for: ${FAILED[*]}"
            echo "Fix the dev site or roll back develop before promoting to production."
            exit 1
          fi
          echo ""
          echo "Dev site is healthy — safe to promote."
