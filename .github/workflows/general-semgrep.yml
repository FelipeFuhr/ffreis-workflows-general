name: General / Semgrep SAST

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to run steps in"
        type: string
        default: "."
      config:
        description: "Semgrep config/ruleset to use (e.g. auto, p/default)"
        type: string
        default: "auto"
      semgrep-version:
        description: "Semgrep version to install (pinned for reproducibility)"
        type: string
        default: "1.165.0"
      timeout-minutes:
        description: "Maximum number of minutes before the job is cancelled"
        required: false
        type: number
        default: 15
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  semgrep:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes || 15 }}
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
        run: 'pip install --only-binary :all: "semgrep==${SEMGREP_VERSION}"'

      - name: Run Semgrep
        run: semgrep scan --config "$SEMGREP_CONFIG"
        env:
          SEMGREP_CONFIG: ${{ inputs.config }}
